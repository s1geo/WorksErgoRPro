roup Deleting a Collection Group You may delete a collection group to separate all of its members. In the eCatalog panel , access the Collections view. Right-click the collection group you want to delete, and then click Delete ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Removing collections and sources from groups", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Removing collections and sources from groups Removing Collections and Sources from Groups You can separate grouped collections and sources by removing them from a collection group. In the eCatalog panel , access the Collections view. Expand a collection group to see its members. Drag the members you"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding a collection", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding a collection Adding a Collection You can add a new empty collection in the eCatalog panel. In the eCatalog panel , access the Collections view. Click the PLUS SIGN , and then click Add Collection ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding items to collections", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding items to collections Adding Items to Collections You may add any displayed item in the eCatalog panel to a collection. In the eCatalog panel , access the Collections view. Click a collection or source to display its items. In the Display area , drag the items you want to add to a collection i"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Deleting a collection", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Deleting a collection Deleting a Collection You may delete a collection from the eCatalog panel. In the eCatalog panel , access the Collections view. Right-click the collection you want to delete, and then click Delete ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Removing items from collections", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Removing items from collections Removing Items from Collections You need to use a shortcut to remove items from a collection. In the eCatalog panel , access the Collections view. Click a collection to display its items. In the Display area , select the items you want to remove. Right-click the selec"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Filtering items", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Filtering items Filtering Items You can filter items based on their type and file format. In the eCatalog panel , click a collection or source. At the bottom of the eCatalog panel , do one of the following: To filter items that are native files, select the Components and/or Layouts check boxes. To f"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Searching for items", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Searching for items Searching for Items You can search for items using keywords that are closely associated with an item's metadata, for example tags. In the eCatalog panel , click a collection or source. In the Display area , Search box , type one or more keywords to find items."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Sorting items", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Sorting items Sorting Items You can sort items in order based on one or more available options. In the eCatalog panel , click a collection or source. In the Display area, click Sort and then click a desired sorting option."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Viewing and editing metadata", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Viewing and editing metadata Viewing and Editing Metadata Every item contains metadata which you can view and edit in the eCatalog panel. In the eCatalog panel , click a collection or source. In the Display area , right-click an item, and then do one of the following: If the item is from a remote so"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Viewing items", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Viewing items Viewing Items Items can be viewed using one or more display modes. In the eCatalog pane l, click a collection or source. In the Display area , click View , &#160; and then move the slider to change the display mode. Details mode In Details mode, items are viewed in a tabular format wit"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Deleting a local copy", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Deleting a local copy Deleting a Local Copy The contents of a folder containing a local copy can be deleted by using the eCatalog panel. In the eCatalog panel , access the Collections view. Click the PLUS SIGN , and then click Edit Sources . In Sources , find the remote source you want to edit. To t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Forcing the update of local copies", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Forcing the update of local copies Forcing the Update of Local Copies A local copy is automatically synced with its source when there is an active connection. This means new files added to a remote source would be automatically checked for and downloaded by the eCatalog panel. In some cases, you may"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Mapping local folder to remote source", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Mapping local folder to remote source Mapping Local Folder to Remote Source A local copy is automatically downloaded to a preset location in your device. You can redefine the location by mapping a different folder to a remote source. In the eCatalog panel , access the Collections view. Click the PLU"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding a smart collection", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding a smart collection Adding a Smart Collection You can add a new smart collection in the eCatalog panel. In the eCatalog panel, access the Collections view. Click the PLUS SIGN , and then click Add Smart Collection . In the middle of New Smart Collection , use the drop-down menus to define the "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Deleting a smart collection", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Deleting a smart collection Deleting a Smart Collection You may delete a smart collection from the eCatalog panel. In the eCatalog panel, access the Collections view. Right-click the smart collection you want to delete, and then click Delete ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing smart collections", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing smart collections Editing Smart Collections You can edit the properties of a smart collection. In the eCatalog panel, access the Collections view. Double-click the smart collection you want to edit in order to access its editor. In New Smart Collection , edit one or more properties, and then"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding a local source", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding a local source Adding a Local Source You can link a local folder of files to the eCatalog panel. In the eCatalog panel , access the Collections view. Click the PLUS SIGN , and then click Edit Sources . In Sources , click Add New Source . In Add Source , click Select Local Folder . In Browse F"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding a remote source", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding a remote source Adding a Remote Source You can link a remote source of files to the eCatalog panel. Generally, a remote source is an HTML file with XML tags for retrieving data from an online library or database. In the eCatalog panel , access the Collections view. Click the PLUS SIGN , and t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Forcing the update of sources", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Forcing the update of sources Forcing the Update of Sources Sources are automatically synced with the eCatalog panel but can be refreshed to force an update. In most cases, you force an update when there is a connection error between a remote source and the eCatalog panel. In the eCatalog panel, acc"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Removing sources", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Removing sources Removing Sources You may remove a source from the eCatalog panel. In the eCatalog panel , access the Collections view. Click the PLUS SIGN , and then click Edit Sources . In Sources , find the listed source you want to remove form the eCatalog panel. In the far right field of the li"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Showing sources", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Showing sources Showing Sources You may edit the visibility of a source in the eCatalog panel. In the eCatalog panel, access the Collections view. Click the PLUS SIGN , and then click Edit Sources . In Sources , find the listed source you want to edit. In the Visible column , do one of the following"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Using sources", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Using sources Using Sources You may edit the use of a source linked to the eCatalog panel. In the eCatalog panel , access the Collections view. Click the PLUS SIGN , and then click Edit Sources . In Sources , find the listed source you want to edit. In the Source Name column , do one of the followin"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding components Adding Components Components can be added to the current layout of the 3D world. When you add a component: The component is automatically selected in the 3D world. The component's properties are displayed in the Properties panel. The PnP command is enabled to allow you to move and "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Aligning components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Aligning components Align Components A selected component can be aligned based on the position and/or orientation of two points in the 3D world. In the 3D world, select the components you want to align. On the Home tab, in the Tools group, click Align . In the Align task pane, edit one or more setti"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Attaching components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Attaching components Attaching Components A component can be attached to a node in another component to form a parent-child relationship. That allows components to move and affect one another in the 3D world. For example, a tool mounted on the end of a robot's arm will move with the robot because th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connect Interfaces", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connect Interfaces Connect Interfaces The Connect Interfaces command allows you to remotely connect components with abstract interfaces. Available interfaces and connections are based on the selected component in the 3D world. Contents&#160; Show Hide Interface Editor Task Pane Interface Editor You "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connect Signals", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connect Signals Connect Signals The Connect Signals command allows you to connect the signals of components as well as the inputs and outputs of robots. Currently, you can only connect Boolean type signals. Available signals and connections are based on the selected component in the 3D world. Conten"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a pattern of components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a pattern of components Creating a pattern of components Selected objects in a simulated environment can be cloned to form an angular or a linear pattern of components. In the scene, select the object you want to clone. On the Home tab, in the Tools group, click Pattern. In the Pattern task"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing component properties", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing component properties Editing Component Properties The Properties panel allows you to edit the location and properties of a selected component in the 3D world. If a selected component contains two or more sets of properties, each set will appear as a tab in the Properties panel. In the 3D wor"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing origin of components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing origin of components Editing Origin of Components The origin of a component can be snapped and moved to a different location in the 3D world. Snapping allows you to pick a new location for a component's origin. In the 3D world, select the component you want to edit. On the Home tab, in the O"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Exporting geometry of components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Exporting geometry of components Exporting Geometry of Components The geometry of one of more selected components can be exported as a new, supported type of file. In the 3D world, select the components you want to export. On the Home tab, in the Export group, click Geometry . In the Export Layout t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Grouping components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Grouping components Grouping components Grouping allows you to quickly select and edit groups of components in the 3D world. Contents&#160; Show Hide Add Group Select Group Select Components in Group Nest Group Remove Group Add Group A component can belong to one or more groups. In the 3D world, sel"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Importing geometry as new components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Importing geometry as new components Importing Geometry as New Components A CAD file can be imported as a new component in the 3D world. Before you import a CAD file, you should clean up the geometry of the file in a CAD editor. Import settings in R-Pro 2.1 can be used to clean up and fix certain is"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Interacting with parts of components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Interacting with parts of components Interacting with Parts of Components Interactive parts of components can be moved in the 3D world based on each part's degrees of freedom (DOF) and limits. For example, some robots have joints that may be rotated around and/or moved along an axis within a range o"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Measuring components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Measuring components Measuring Components Measurements can be taken to evaluate the distance and/or angle between two points in the 3D world. The approximated value of a measurement is controlled by a Display accuracy setting that affects how many digits are displayed to the right of a decimal point"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Moving and rotating components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Moving and rotating components Moving and Rotating Components The location of a component in the 3D world is defined by coordinate values (XYZ) and degrees of rotation (RxRyRz) in a coordinate system. There are three available coordinate systems in the 3D world: World is a global coordinate system w"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Plugging in components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Plugging in components Plugging in Components The PnP command allows you to plug components into one another at physical interfaces. When you select a component: Available physical interfaces are marked by arrows highlighted yellow and located at Frame features in the component. Connected physical i"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Reporting statistics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Reporting statistics Reporting Statistics The Statistics dashboard allows you to report statistics collected from components during a simulation. Contents&#160; Show Hide Open the Dashboard Choose a Layout Choose a Chart Edit Chart Properties Plot Data View Data Print Charts Export Data Open the Das"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting components Selecting Components A selection in the 3D world is highlighted by Silhouette and Fill colors. In the 3D world, you can: Click any component to select it. Hold down CTRL and click components to add or remove them from a selection. Click an empty space in the 3D world to clear a "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting components in an area", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting components in an area Selecting Components in an Area The Select command allows you to make area selections in the 3D world and disable other modes that may move or otherwise alter components. When using area selection, components must occupy a significant amount of space in the drawn regi"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Snapping components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Snapping components Snapping Components &#160;A selected component can be snapped to a location relative to other components in the 3D world. In the 3D world, select the components you want to relocate. On the Home tab, in the Tools group, click Snap . In the Component Snap task pane, under the Mode"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Accessing Connectivity feature", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Accessing Connectivity feature Accessing Connectivity Feature The Connectivity feature and its commands can be accessed from a Connectivity tab that appears above the Ribbon. If the Connectivity tab is not visible, you either need to enable the feature or restart R-Pro 2.1. Contents&nbsp; Show Hide "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connecting to an OPC UA Server", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connecting to an OPC UA Server Connecting to an OPC UA Server The OPC UA plugin allows you to connect a running OPC UA server. Contents&nbsp; Show Hide Step 1. Add Server Step 2. Verify Network Connection Step 3. Activate Connection Step 1. Add Server You can manually add a new server connection, im"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connecting to a TwinCAT PLC", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connecting to a TwinCAT PLC Connecting to a TwinCAT PLC The Beckhoff ADS plugin allows you to connect a running Beckhoff TwinCAT PLC version 2 or 3 with a loaded program. Important: Make sure you have installed the necessary ADS components to your device and properly configured the PLC before doing "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connecting to Siemens SIMIT", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connecting to Siemens SIMIT Connecting to Siemens SIMIT The SIMIT plugin and the R-Pro 2.1 coupling allows user to connect to the SIMIT real-time behavior emulator software. Contents&nbsp; Show Hide SIMIT connection overview R-Pro 2.1 coupling SIMIT &nbsp;plugin connection and signal value exchange "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connecting to WinMOD", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connecting to WinMOD Connecting to WinMOD The WinMOD Net connection plugin implements the connection to the WinMOD simulation system using its own proprietary communication library called WinMOD Net. The WinMOD Net protocol is TCP/IP based and thus works both locally and over a network. Note: The co"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connectivity", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connectivity Connectivity The Connectivity add-on allows you to connect a programmable logic controller (PLC) or server to R-Pro 2.1 and transport data over that connection. As a result, you can read and write the variables of components in a 3D world simulation over a network. Contents Terminology "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Enabling Connectivity feature", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Enabling Connectivity feature Enabling Connectivity Feature The Connectivity feature can be turned on/off using a backstage option. Click the File tab, and then on the Navigation pane, click Options . Click Add On , and then in Connectivity , do one of the following: To enable the feature, click Ena"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connecting to a Fanuc robot controller", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connecting to a Fanuc robot controller Connecting to a Fanuc robot controller 1. About the plugin The Fanuc Robot plugin allows you to connect to a Fanuc robot controller during simulation and exchange data. For example, a program running in a virtual or physical Fanuc controller can drive the joint"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Locking values", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Locking values Locking Values Locking allows you to set fixed values for variable pairs. The fixed or locked value is used when the source and destination variables in the pair synchronize with one another. The values of simulation and server variables in the pair can change during a simulation, but"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Pairing variables", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Pairing variables Pairing Variables A variable group in a plugin connection is used to pair simulation variables with server variables. This means the value of a property or signal in a component can be linked to the value of a variable available in a connected PLC or server. Do one of the following"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Supported data types", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Supported data types Supported Data Types On the simulation side, you can connect i.e. component properties, signals, controller bases and tools. These simulation variables can be connected to external software and devices via connectivity plugins. The connectivity feature supports the following sim"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Terminology", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Terminology Terminology Please be aware of the following terms and their context: Simulation . Refers to either to the simulation of 3D world or the R-Pro 2.1 product itself. Server . Refers to either a PLC or server. Simulation PC . The device running R-Pro 2.1. Server PC . The device running a PLC"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Universal Robots RTDE Plugin", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Universal Robots RTDE Plugin Universal Robots RTDE Plugin The Universal Robots RTDE plugin allows you to connect Universal Robot CB3 series robot controllers with an RTDE interface. You can also connect a URSim robot controller simulator with an RTDE interface. For example, you can can establish a c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Using the Siemens S7 plugin", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Using the Siemens S7 plugin Connecting to a Siemens S7-series PLC The Siemens S7 plugin allows you to connect to Siemens S7-series PLCs using a S7 communication (S7comm) protocol. More specifically, it uses the “PUT” and “GET” functionality of the S7comm protocol. It is based on TCP/IP and works ove"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Backward Compatibility", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Backward Compatibility Backward Compatibility If you are upgrading layouts made with an older version of the Stдubli add-on, refer to the following information about backward compatibility. Issue Explanation The new add-on uses the same configuration persistence format as the old add-on. This means "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "CS8 Connections", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "CS8 Connections CS8/CS9 Connections If you are using the Stдubli add-on with a real or emulated Stдubli CS8/CS9 controller, refer to the following points for guidance in technical and development matters. Communication is handled using TCP/IP, HTTP and SOAP protocols. The Stдubli controller implemen"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Getting Started", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Getting Started Getting Started Contents&nbsp; Show Hide Step 1. Configure Stдubli Robotics Suite Step 2. Enable Stдubli add-on Step 3. Access Stдubli Add-on Step 4. Connect to Stдubli Controller Step 5. Map Robot Step 6. Teach Robot Step 7. Post-Processing Step 1. Configure Stдubli Robotics Suite I"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Post Processor", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Post Processor Post Processor The Stдubli add-on allows you to translate the program of a robot in the 3D world to a VAL 3 application. This is known as post-processing a robot program. The generated VAL 3 application is a set of XML files that form a project, which can be opened in Stдubli Robotics"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Staubli Add-on", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Staubli Add-on Stдubli Add-on The Stдubli add-on allows you to interface with a Stдubli robot controller. For example, you can program robots in the 3D world as well as test, simulate and post-process VAL 3 applications. Note: Added in R-Pro 2.1 4.0.4. Contents Getting Started Backward Compatibility"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "User Interface", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "User Interface User Interface Contents&nbsp; Show Hide Stдubli Cell Configuration Properties Change Connected Robot Create VAL 3 Application Stдubli Controller I/O Mappings I/O Mappings Editor Stдubli Cell Configuration The Stдubli Cell Configuration panel is the main panel for the Stдubli add-on. 1"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating an annotation", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating an annotation Creating an Annotation An annotation allows you to create a visual callout or markup for explaining one or more elements of a drawing. On the Drawing tab, do one of the following: To create a rectangle-shaped annotation, in the Annotations group, click Rectangle . To create a "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a dimension", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a dimension Creating a Dimension A dimension allows you to visualize distances and angles between lines, points and edges in drawings. On the Drawing tab, in the Dimension group, do one of the following: To create a dimension for measuring the angle between two points, click Angular . To cr"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a drawing", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a drawing Creating a Drawing A drawing is a projection of components in the 3D world using 2D line sets. Generally, you can auto-generate drawings for a layout in the 3D world using standard views. On the Drawing tab, in the Create View group, do one of the following: To create a top view d"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a drawing template", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a drawing template Creating a Drawing Template An existing drawing template can be used as a guide for developing new ones. Another option is to add/remove files from the folder containing your application's drawing templates. This workflow assumes you have access to the Modeling tab. Open "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Exporting a drawing", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Exporting a drawing Exporting a Drawing Drawings can be exported as a new, supported type of file. If you want to export a specific set of drawings, directly select the drawings in the drawing world; otherwise, go onto the next step. You can hold down CTRL to add/remove a drawing from a selection On"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Finding a drawing template", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Finding a drawing template Finding a Drawing Template Drawing templates used by R-Pro 2.1 are contained in a Drawing Templates folder located in the same directory as your R-Pro 2.1 program files."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Importing a drawing template", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Importing a drawing template Importing a Drawing Template A drawing template allows you to scale drawings, generate a bill of materials (BOM), and export a print-ready document or CAD file for your drawings. On the Drawing tab, in the Drawing group, click Load Template . In the Template Import task "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Printing a drawing", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Printing a drawing Printing a Drawing A drawing can be exported to produce a print-ready document. Generally, a template is used to print one or more drawings as a sheet. If do not want to use a template for printing, select the drawings you want to print in the drawing world. On the Drawing tab, in"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Closing a layout", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Closing a layout Closing a Layout A layout is always open in the 3D world. That means closing one layout in the 3D world opens a new empty layout in the 3D world. Click the File tab, and then on the Navigation pane, click New . In the prompt, do one of the following: Click Don't Save to not save and"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a 3D dimension", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a 3D dimension Creating a 3D dimension A dimension allows you to visualize distances and angles between lines, points and edges in the simulation world. On the HOME tab, in the Dimension group, do one of the following: In the simulation world, select two points that define the dimension, an"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Exporting geometry of layouts", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Exporting geometry of layouts Exporting Geometry of Layouts The geometry of an entire layout can be exported as a supported file type. On the Home tab, in the Export group, click Geometry . In the Export Layout task pane, under Components to export , click All . In the File Format list, click a supp"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Opening a layout", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Opening a layout Opening a Layout A layout is a rpro file that allows you to save your work in the 3D and drawing worlds. Layouts are always opened in the 3D world and contain references to components, layout items and settings for a scene. A layout is an archive file, so when you open a layout its "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Opening a new layout", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Opening a new layout Opening a New Layout When you start R-Pro 2.1 a new empty layout is opened automatically in the 3D world. If you want to clear and remove everything in the 3D world layout: Click the File tab, and then on the Navigation pane, click Clear All . Tip: You can press CTRL+N to clear "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Saving a layout", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Saving a layout Saving a Layout A layout allows you to save the location, connections and property values of components in the 3D world. A layout also stores your view of a scene and any layout items in the 3D world and drawing area. In the 3D world, adjust the view to define the preview image of th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Add and edit base frames", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Add and edit base frames Add and Edit Base Frames A base frame is a coordinate system used by a robot and other types of components to simplify locations in an area. That is, you can use a base frame as a local coordinate system for defining the position and orientation of objects. In the 3D world, "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Add and edit tool frames", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Add and edit tool frames Add and Edit Tool Frames A tool frame is a point of reference used by robots and other types of components for positioning objects. Generally, a tool frame is used with a manipulator to jog a robot and teach positions in relation to a base coordinate system (active base fram"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Assigning a joint to a controller", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Assigning a joint to a controller Assigning a Joint to a Controller The joint of a node can be assigned to a Robot or Servo Controller behavior, thereby the motion of that joint can be driven by a controller. In the 3D world, select a component. Click the Modeling tab, and then in the Component Grap"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Collapsing features", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Collapsing features Collapsing Features Collapsing allows you to merge a selected feature and its child features into a single Geometry feature. This, of course, would remove the hierarchy of the collapsed features. Select a feature. You can select multiple features, but this will not merge the sele"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a new behavior", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a new behavior Creating a New Behavior A behavior is an action or set of actions that a component can perform before or during a simulation. Either create or select a component in the 3D world. Click the Modeling tab, and then in the Component Graph panel, Component Node Tree , select a nod"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a new component", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a new component Creating a New Component A new component can be created at the 3D world origin. In most cases, you should add at least one feature to a component after its creation. On the Modeling tab, in the Component group, click New . (Optional) In the Geometry group, click the Features"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a new feature", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a new feature Creating a New Feature Geometry in a component is formed into sets which are grouped in features. Not all features contain geometry or act as primitive shapes. Some features perform operations on other features, while other types of features generate data related to the 3D wor"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a new node", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a new node Creating a New Node A link is a node added to a component's structure and is mainly used to define joints and other mechanisms of movement in a component. Either create or select a component in the 3D world. Click the Modeling tab, and then in the Component Graph panel, Component"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating a new property", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating a new property Creating a New Property A property is a variable of a component that can be referenced by other objects in that component. Properties of this scope are contained in the root node of a component. Either create or select a component in the 3D world. On the Modeling tab, in the "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Decimating geometry", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Decimating geometry Decimating Geometry Decimation allows you to simplify the tessellation of geometry in features by merging edges and eliminating redundant vertices. The operation will try to merge all points within a max error tolerance to reach a desired quality, and then print the results in th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Defining a joint offset", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Defining a joint offset Defining a Joint Offset The Move command, other tools and properties can be used to define the Offset property of a selected node and its joint. In the 3D world, select a component. Click the Modeling tab, and then in the Component Graph panel, Component Node Tree , select a "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing node feature tree", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing node feature tree Editing Node Feature Tree The feature tree of a selected node can be edited using a mouse and quick commands. Contents&#160; Show Hide Moving Exploding Grouping Removing Moving You can drag and drop features to different depths and levels in the same or other node feature t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Extracting geometry into new component", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Extracting geometry into new component Extracting Geometry into New Component Extraction allows you to regroup selected features/links into new components. Generally, extraction is used when parts and assemblies in an imported CAD file were not formed into separate components. Select one or more fea"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Extracting geometry into new node", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Extracting geometry into new node Extracting Geometry into New Node Extraction allows you to regroup selected features into new nodes. Generally, the extraction of features to new links is used to speed up the modeling process of an imported CAD file as a component with movable parts. That is, the t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Importing mathematical data", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Importing mathematical data Importing Mathematical Data You can import the mathematical data of a supported CAD file, for example boundary representations (BREP) and curves. Note: This task was made using this CAD file . Either from the Home tab or Modeling tab, in the Import group, click Geometry ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Interacting with a joint", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Interacting with a joint Interacting with a Joint In previous product versions, you needed to use a Jog Info behavior to make the joint of a node interactive. Now, the joint properties of a node are used to automatically make a joint interactive if a Jog Info behavior is not available for that joint"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Inverting geometry", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Inverting geometry Inverting Geometry The geometry of a feature can be inverted to face opposite its normal direction. Geometry must be contained in a Geometry feature in order to be inverted, otherwise you would first need to collapse a feature before inverting its geometry. Select the root node of"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Making component unique or shared", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Making component unique or shared Making Component Unique or Shared Components in the 3D world with the same VCID can share identical feature trees. This is indicated by a feature selection and has an added benefit in terms of memory. Identical means the components are exact copies of one another. G"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Merging faces", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Merging faces Merging Faces Points in faces can be merged together to form smoother surfaces. On the Modeling tab, in the Geometry group, click the Tools arrow, and then click Merge faces . In the 3D world, select a geometry set. In the Merge faces task pane, set Tolerance to the desired radius for "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Merging features", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Merging features Merging Features Merging allows you move geometry in different Geometry features into a single Geometry feature. Select the Geometry features you want to merge together in a component. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Feature Tools , "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Saving a component", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Saving a component Saving a Component A component can be saved in order to be loaded and used in any layout opened in the 3D world. Select the component you want to save in the 3D world. On the Modeling tab, in the Component group, do one of the following: To save a component to its existing file, c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Searching component data", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Searching component data Searching Component Data At the top of each pane in the Component Graph panel are tools for searching and filtering data in a selected component. In the 3D world, select a component. Click the Modeling tab, and then in the Component Graph panel, do one of the following: To c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting behaviors in a component", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting behaviors in a component Selecting Behaviors in a Component You need to use the Component Graph panel to select behaviors in a component. In the 3D world, select a component or one of its features. If you did not select a feature, click the Modeling tab, and then in the Component Graph pan"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting features in a component", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting features in a component Selecting Features in a Component The context of a scene when modeling a component allows you to directly select the features of any component in the 3D world. In some cases, you cannot directly select a feature if it does not occupy any space and visually represent"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting nodes in a component", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting nodes in a component Selecting Nodes in a Component You can use the Component Graph panel to select nodes in a component. It is helpful to use the Move command for showing the offset and joint axis of a selected node in the 3D world, whereas the Structure Show command can be used to show t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting properties in a component", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting properties in a component Selecting Properties in a Component You need to use the Component Graph panel to select properties in a component. When a property is selected, its properties will be displayed in a Property task pane. Otherwise, any visible properties of a component can be read a"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Simplifying geometry", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Simplifying geometry Simplifying Geometry The geometry of a feature can be simplified to reduce its data count and visualize its maximum volume. Select one or more features in a component. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Simplify , do one of the foll"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Slicing geometry", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Slicing geometry Slicing Geometry The geometry of a feature can be cut and split into new Geometry features. Select one of more features in a component. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Feature Tools , click Slice . In the Slice task pane, define a Sn"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Splitting features", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Splitting features Splitting Features Splitting allows you to regroup geometry in features into new features. Geometry must be contained in a Geometry feature in order to be split, otherwise you would first need to collapse a feature before splitting its geometry. Select the root node of a component"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Transferring components to other components", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Transferring components to other components Transferring Components to Other Components Behaviors that support material flow can be connected to transfer components from one component to another component by using interface type behaviors. In the 3D world, select a component. Click the Modeling tab,"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Transferring components to other behaviors", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Transferring components to other behaviors Transferring Components to Other Behaviors Behaviors that support material flow can be connected to transfer components within a component by editing the properties of connectors. In the 3D world, select a component. Click the Modeling tab, and then in the "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Using external Python editor", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Using external Python editor Using External Python Editor To use an external Python editor, go to the following backstage location: FILE - Options - General – Configuration. From the Python script editor option, select the External editor . From the System Default , change which editor program shoul"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding a Decal", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding a Decal Adding a Decal A decal can be added to a component by using geometry to preform a shape with texture coordinates. The added shape is contained in a new Geometry feature, which you should assign a material. In most cases, the material of a decal has a texture file, for example an image"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding Material to User Library", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding Material to User Library Adding Material to User Library You can add a material to a user library. The material must be available in the current layout of the 3D world and not already stored in user and system libraries. The material is saved in a Materials.xml file stored in the My Materials"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding New Materials", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding New Materials Adding New Materials You can add a new material and assign it to objects in the current layout of the 3D world or save the material in your user library. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click Assign . In the Assign mat"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Assigning Texture Coordinates", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Assigning Texture Coordinates Assigning Texture Coordinates Texture coordinates can be assigned to geometry by using a mapping tool for spherical, cylindrical and planar projections. This allows you to map the texture of material to objects in the 3D world. On the Modeling tab, in the Geometry group"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Assigning Material", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Assigning Material Assigning Material You can assign a material to an object in the 3D world. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click Assign . In the Assign material task pane, do all of the following: Expand Mode , and then select Assign . "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Clearing Material", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Clearing Material Clearing Material You can clear the material assigned to an object in the 3D world. After you clear the material, the object would inherit a material from either another feature, link or component. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Ma"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Deleting Materials from Layout", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Deleting Materials from Layout Deleting Materials from Layout You can delete a material from objects in the 3D world. This is similar to clearing, but you are removing the material of multiple objects. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Displaying Materials", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Displaying Materials Displaying Materials You can display available materials as either a list or grid. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click Assign . In the Assign material task pane, expand Materials , and then do one of the following: T"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Materials", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Materials Materials Contents Material Properties Material Inheritance Picking Material Clearing Material Assigning Material Searching for Material Displaying Materials Selecting Materials Setting Materials Deleting Materials from Layout Adding New Materials Adding Material to User Library Removing M"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Material Inheritance", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Material Inheritance Material Inheritance A material can be assigned to a geometry set, feature, link and component. Any geometry set or feature that does not have an assigned material will inherit the material of its parent feature or node. Generally, a node inherits the material of its root node/c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Material Properties", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Material Properties Material Properties A material has the following set of properties. Show material preview in 3D World - Turns on/off a preview of the material in the 3D world. Name - Defines the name of the material. Color - Defines the color of the material. Texture and Texture Blend - Defines "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Picking Material", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Picking Material Picking Material You can pick the material assigned to an objet in the 3D world. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click Assign . In the Assign material task pane, expand Mode , and then select Pick . In the 3D world, click "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Removing Material from User Library", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Removing Material from User Library Removing Material from User Library You can remove a material stored in a user library. This does not delete a material from a layout. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click Assign . In the Assign materia"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Searching for Material", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Searching for Material Searching for Material You can search for a material that is either being used in a layout, defined as a user material or available in a library. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click Assign . In the Assign material "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting Materials", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting Materials Selecting Materials You can select a material being used by more than one object in the 3D world. This is similar to picking, but you are selecting the material of multiple objects. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Setting Materials", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Setting Materials Setting Material You can set the material of one or more objects in the 3D world. This is similar to assigning, but you are setting the material of multiple objects. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Material , click Assign . In the A"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Cables in physics world", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Cables in physics world Cables in Physics Worlds R-Pro 2.1 supports the use of pulleys, wires and other types of objects which are implemented as a Physics Cable behavior. Geometry Every cable is generated with its own set of geometry. The geometry of a cable consists of capsules which expand, shrin"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Colliders in physics world", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Colliders in physics world Colliders in Physics World Colliders are objects that can react to physical objects during a simulation. Each collider is a shell that encompasses the geometry of a feature in a component. Every feature, including the root feature of a node, has its own Collider property. "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Collisions in physics world", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Collisions in physics world Collisions in Physics World A collision can occur between any physical object that has a collider and a Physics Entity behavior. The properties of a Physics Entity behavior can be used to include/exclude a node from colliding with other nodes in the physics world. Name De"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Joints in physics world", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Joints in physics world Joints in Physics World R-Pro 2.1 supports the use of D6 joints which are implemented as a Physics Joint behavior. These types of joints can have custom definitions and support multiple degrees of freedom. In the 3D world, select a component. On the Modeling tab, in the Compo"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Paths in physics world", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Paths in physics world Paths in Physics World The movement and flow of components with physical properties can be accomplished by using a Physics Path behavior. This allows you to apply contact forces to components moving along paths. For example, you can push, divert, divide, drop, and accumulate c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Physics world", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Physics world Physics World In R-Pro 2.1 there is simulation world and &nbsp; physics world in the 3D environment. This coexistence allows components to act independently of physical forces. In addition, components can move in and out of the simulation world and into the physics world. Generally, th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Process Modeling", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Process Modeling Process Modeling The Process Modeling allows you to manage products, processes and process flows in a layout. This feature streamlines the layout planning process with a visualized workflow, quick simulation setup and enhanced simulation performance. Content Terminology Using proces"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Terminology", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Terminology Terminology Please be aware of the following terms and their context: Process Editor . GUI for process executor (Process) Statement . Single execution step in a routine (Process) Routine . Executable sequence of statements saved in a process executor. See also Process implementation. Req"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Using Process Variables", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Using Process Variables Using Process Variables Process variables are local variables in a process specific to a routine. A variable in a routine can only be set and referred in the same routine. However, both process requirements and process routine statements of a routine can access the same varia"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Calling subroutines in robot program", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Calling subroutines in robot program Call Subroutines in Robot Program In order for a subroutine to be executed, it needs to be called by either the Main routine or another subroutine that is executed in a robot program. Click the Program tab, and then use the Jog command to the select robot you wan"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connecting external axes", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connecting external axes Connecting External Axes A robot can be remotely connected to external kinematic components, for example workpiece positioners, using abstract interfaces. The workflow for connecting external axes to a robot is similar to remotely connecting components. On the Home tab, in t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Connecting signals to robot inputs and outputs", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Connecting signals to robot inputs and outputs Connecting Signals to Robot I/O The signal editor of a robot can be used to connect signals in other components as inputs and outputs. When wiring inputs and outputs, the signal editor of a robot allows you to change the input/output port for a connecte"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating statements in robot program", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating statements in robot program Creating Statements in Robot Program A statement is a command executed by a robot in its program. Statements in a robot program are contained in subroutines and executed in order one after the other. Explicit variables and other properties of a robot, including I"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Creating subroutines in robot program", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Creating subroutines in robot program Create Subroutines in Robot Program A subroutine contains a sequence of statements that can be executed by a robot. Subroutines need to be called in the Main routine of a robot program either directly or by another subroutine in order to be executed during a sim"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Detecting collisions", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Detecting collisions Detecting Collisions Collisions between a robot and other components can be detected in the 3D world using global settings and detectors. A detector is a collision test between two lists, A and B, with each list containing nodes. The geometry of nodes in list A is compared to th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing base and tool frames", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing base and tool frames Edit Base and Tool Frames The Move command and other tools can be used to edit robot base and tool frames. Click the Program tab, and then Jog panel, select the base or tool frame you want to edit. In this case, the Move command is automatically enabled and a manipulator"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing robot positions", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing robot positions Edit Robot Positions The location of linear and point-to-point robot positions in a program can be edited using the Move and Jog commands and other tools. Click the Program tab, and then do one or more of the following: In the 3D world, select the robot positions you want to "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing statements in robot program", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing statements in robot program Edit Statements in a Robot Program Statements in a robot program can be edited using the Properties panel. Click the Program tab, and then use the Jog command to select the robot you want to program in the 3D world. In the Program Editor panel, Subprograms pane, s"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Exchanging robots", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Exchanging robots Exchanging Robots A robot can be exchanged with another robot in the 3D world to switch locations and programs. When exchanging robots, a compatible robot will be highlighted yellow in the 3D world to indicate it can be exchanged with the selected robot. In the 3D world, select a r"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Limiting a robot and its joints", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Limiting a robot and its joints Limiting a Robot and its Joints A limit is a constraint or barrier that can be used to restrict a robot in its space. Generally, when you are programming a robot, limits are used to detect and show potential errors. On the Program tab, in the Limits group, do one or m"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Locking robot positions", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Locking robot positions Lock Robot Positions A global setting can be used to lock the location of all motion targets in the 3D world. That is, a motion target can retain its location if you move its parent, for example a robot or base frame. On the Program tab, in the Lock Positions group, do one of"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Mapping signals to actions in robot", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Mapping signals to actions in robot Mapping Signals to Actions in Robot Robot I/O can be mapped to base and tool frames in order to perform tool-specific actions. For example, you can use an Set Binary Output statement to signal grasp and release actions, tracing, and the mount and dismount of tool "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Painting", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Painting Painting The Paint add-on allows you to prepare, simulate and analyze the results of paint processes using a robot and paint gun. Contents&#160; Show Hide Enable Add-on Access Paint View Prepare Components Define Visualization of Paint Measure Paint Thickness Remove Paint Paint Distribution"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting a robot and its data", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting a robot and its data Select a Robot and its Data A robot and its data can be selected like any other component in the 3D world. You need to use the Jog command to select and manipulate a robot in the 3D world. Otherwise, the Select and Move commands will select and move the robot as a comp"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selecting statements in robot program", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selecting statements in robot program Selecting Statements in a Robot Program The Program Editor panel is used to view a robot program as well as create and edit statements in subroutines. Click the Program tab, and then in the Program Editor panel, click the tab of a robot to access its program. In"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Sweeping geometry", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Sweeping geometry Sweeping Geometry A robot can send an output signal in its program that triggers the sweeping of geometry. By default, signal 81 in a robot is mapped to perform this action. Contents&#160; Show Hide Swept Volume Configure Action Simulate Action Swept Volume Sweeping is a process th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Teaching a path of positions", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Teaching a path of positions Teaching a Path of Positions A Path statement allows you to add and edit robot positions along the curves and bisectors of geometry. Contents&#160; Show Hide Add Path and Positions Select Path and Positions Edit Path and Positions Path and Position Properties Add Path an"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Teaching positions using align options", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Teaching positions using align options Teaching Positions using Align Options The Jog command allows you to align a robot as well as end-of-arm tools and grasped components. On the Program tab, in the Manipulation group, click Jog . Select the robot you want to program. In the Jog panel, Robot secti"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Teaching positions using joint values", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Teaching positions using joint values Teaching Positions using Joint Values The Jog command and the Jog panel are used to teach a robot positions as well as configure the robot's joints. This includes external joints connected to the robot. On the Program tab, in the Manipulation group, click Jog . "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Teaching positions using snap options", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Teaching positions using snap options Teaching Positions using Snap Options The Jog command allows you to use a manipulator for teaching robots positions. At the origin of the manipulator is a magenta colored torus (ring) which allows you to move and snap a robot to points on other components. On th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Using routine variables", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Using routine variables Using Routine Variables Variables can be added to routines in a robot program, and then used to add complexity and define conditions for If and While statements. A routine variable is a local variable of a robot program and cannot be used by a statement in a different routine"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Visualizing robot motion paths", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Visualizing robot motion paths Visualizing Robot Motion Paths The path of a robot to and from motion targets can be visualized in the 3D world. On the Program tab, in the Show group, do one or more of the following: To show the direction and path between motion targets, select the Connecting Lines c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Visualizing the tool detection volume", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Visualizing the tool detection volume Visualizing the tool detection volume DetectionVolume property visualizes the detection volume of the selected tool TCP from a robot. DetectionVolume shows which product(s) are grasped to a robot when utilizing grasp/release signals 1-16. To activate the Detecti"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Animating camera movements", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Animating camera movements Animating Camera Movements The Camera Animator command allows you to write a program for moving the camera of the 3D world during a simulation. The program is a layout item, thereby it is saved with a layout. Contents&#160; Show Hide Task Pane API Task Pane You can write t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Exporting simulation as image", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Exporting simulation as image Exporting Simulation as Image A simulation can be exported as an image to capture the scene in the 3D world. When exporting images, a red boundary will appear in the 3D world to indicate the area of your view that can be captured and saved as an image. On the Home tab, "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Printing simulation as image", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Printing simulation as image Printing Simulation as Images A simulation can be printed or saved in a print-friendly format. When printing an image, the size and view of the 3D world are used to generate a scalable, vector graphic. Do one or more of the following: Drag the boundaries of the 3D world "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Recording simulation as 3D PDF", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Recording simulation as 3D PDF Recording Simulation as 3D PDF If you record a simulation, the animated actions and movements of components are recorded. If you do not want to record animations, you can stop a simulation, and then export a component or layout as a static PDF. Another option is to pri"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Recording simulation as animation", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Recording simulation as animation Recording Simulation As Animation A simulation can be recorded as an animation and exported to a rprv file. This allows you to view and playback the simulation with a mobile viewer or experience the simulation in virtual reality. A recording captures the actions and"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Recording simulation as video", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Recording simulation as video Recording Simulation as Video If you record a simulation, the animated actions and movements of components are recorded and saved to file. If you do not want to record animations, you can stop a simulation, and then export a component or layout as a static PDF. Another "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Repeating a simulation", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Repeating a simulation Repeating a Simulation A simulation can be repeated to loop back and repeat simulated processes. In the 3D world, on the Simulation controls, click Settings . Select the Repeat check box."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Streaming Animation", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Streaming Animation Streaming Animation It is possible to stream the 3D scene in live connection to a client viewer. Step 1. Enable Animation Streaming The Animation Streaming feature can be turned on/off using a backstage option. Click the File tab, and then on the Navigation pane, click Options . "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Using a runtime", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Using a runtime Using a Runtime A runtime allows you to define how long execute a simulation in the 3D world. In the 3D world, on the Simulation controls, click Settings . In Clock Display Mode , click the desired time format. In Simulation Run Time , do one of the following: To remove a time restri"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Using a warm up time", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Using a warm up time Using a Warm Up Time A warm up time allows you start a simulation after at certain amount of time has elapsed in the 3D world. This allows you to start a simulation before, after or during a process. In the 3D world, on the Simulation controls, click Settings . In Warm Up Time ,"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Defining units and quantities", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Defining units and quantities Defining Units and Quantities A system of measurement for units and quantities in R-Pro 2.1 is defined as a unit family. Within each unit family are unit groups containing units. Every unit is defined by a quantity that is either a scalar (magnitude) or vector (magnitud"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Cloning selected objects", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Cloning selected objects Cloning Selected Objects Selected objects in a simulated environment can be
