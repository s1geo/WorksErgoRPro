O CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Операторы группировки", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Операторы группировки Операторы группировки Операторы группировки полезны для управления оценкой выражения. Круглые скобки Выражения могут быть сгруппированы с помощью круглых скобок () и всегда вычисляются первыми. 1 + 2 * 3 = 7, тогда как (1 + 2) * 3 = 9 Условный оператор Условный оператор ?: може"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Приоритет оператора", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Приоритет оператора Приоритет оператора Операторы оцениваются на основе их приоритета друг перед другом в выражении. Приоритет Оператор Использование Порядок разбора 1 Пост инкремент а++ Слева направо Пост декремент а-- Оператор-член a.b Оператор индекса a[b] Вызов функции а(...) Круглые скобки (..."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выражения оператора процесса", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выражения оператора процесса Выражения оператора процесса При написании выражений для операторов процесса вы можете получить доступ к свойствам объектов динамических компонентов и элементов списков. Доступ Вы можете использовать запись через точку (.), чтобы получить значение свойства Продукта , Тип"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выражения оператора робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выражения оператора робота Выражения оператора робота&nbsp; Синтаксис для ссылки на порты Логической карты сигналов # IN и OUT представляют логические карты сигналов, на которые ссылается поведение Исполнителя робота как на входы и выходы. &nbsp; IN[&lt;номер порта &gt;] OUT[&lt;номер порта &gt;] &n"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Типы и операторы", "url": "", ент параллелепипед представляет собой форму куба/коробки. Как правило, параллелепипед формируется и делается параметрическим с использованием выражений со свойствами компонентов. Свойства Название Описание Наименование Определяет наименование параллелепипеда. Видимы"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Конус", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Конус Конус Конусный элемент имеет форму конуса/усеченного конуса. Конусы — это гибкие формы, которые можно моделировать для визуализации пространств, углов обзора, полей и других типов объектов на лету. Свойства Название Описание Наименование Определяет наименование конуса. Видимый Включает/выключа"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Цилиндр", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Цилиндр Цилиндр Цилиндрический элемент представляет собой цилиндрическую форму. Цилиндры представляют собой гибкие формы, из которых можно формовать множество различных объектов. Свойства Название Описание Наименование Определяет наименование цилиндра. Видимый Включает/выключает видимость цилиндра. "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выдавливание", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выдавливание Выдавливание Элемент Выдавить выдавливает геометрию своих дочерних элементов. Выдавливание можно использовать для деформации и искажения объектов, а также для выдавливания поверхностей. Свойства Название Описание Наименование Определяет наименование элемента. Материал Определяет материа"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "ЭЛЕМЕНТЫ", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "ЭЛЕМЕНТЫ Элементы СОДЕРЖАНИЕ УГЛОВОЙ КЛОН ПАРАЛЛЕЛЕПИПЕД КОНУС ЦИЛИНДР ВЫДАВЛИВАНИЕ СИСТЕМА КООРДИНАТ ГЕОМЕТРИЯ ЛИНЕЙНЫЙ КЛОН ОТРАЖЕНИЕ ПЛОСКОСТЬ ЭЛЕМЕНТ PYTHON ВРАЩАТЬ СФЕРА ПЕРЕКЛЮЧАТЕЛЬ ТЕКСТ ПРЕОБРАЗОВАТЕЛЬ ПРИЗМА"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Система координат", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Система координат Система координат Элемент Рамка — это опорная точка в трехмерном мире с определенным положением и ориентацией. Свойства Название Описание Наименование Определяет наименование Системы координат. Видимый Включает/выключает видимость Системы координат. ИспользоватьКакНаправляющую Опре"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Геометрия", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Геометрия Геометрия Объект Геометрия — это контейнер геометрии, который либо импортируется, либо генерируется в объекте, либо сворачивается из других объектов. Элементы геометрии можно использовать для загрузки взаимозаменяемой геометрии, и они являются контейнером по умолчанию для импортированной г"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Линейный клон", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Линейный клон Линейный клон Элемент линейного клонирования клонирует дочерние элементы вдоль оси. В некоторых случаях операции линейного клонирования объединяются в цепочку для клонирования объектов по двум или более осям. Свойства Название Описание Наименование Определяет наименование элемента. Кол"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Отражение", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Отражение Отражение Элемент отражает и масштабирует свои дочерние элементы по одной-трем осям. Операция «Отражение» может быть полезна, когда вы хотите визуализировать геометрию и сохранить небольшой размер файла, например, когда вам нужно использовать один файл геометрии для столбов и опорных колон"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Плоскость", "u ин из своих дочерних элементов и отключает другие дочерние элементы. Операции переключения полезны, если вам нужно отключить геометрию или другие операции на основе свойств компонента. Свойства Название Описание Наименование Определяет наи"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Текст", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Текст Текст Текстовый элемент— это контейнер текста, который визуализируется в трехмерном мире. Текстовые элементы полезны для маркировки процессов и этапов на планировке, а также потока компонентов. Свойства Название Описание Наименование Определяет наименование элемента. Видимый Включает/выключает"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Преобразовать", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Преобразовать Преобразовать Элемент Преобразовать позволяет вам писать выражения для преобразования дочерних элементов. Операции преобразования используют символ точки (.) для разделения вложенных выражений, и вам следует обратиться к Приоритету оператора , чтобы знать порядок синтаксического анализ"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Призма", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Призма Призма &nbsp; Элемент Призма представляет собой клиновидную форму. Призмам можно придать различную форму, длину и высоту, а также зеркально отразить по разным осям. Свойства Название Описание Наименование Определяет наименование Призмы. Видимый Включает/выключает видимость Призмы. Материал Оп"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Добавить в список", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Добавить в список Добавить в список Оператор Добавить в список позволяет присоединять переменную (НаименованиеИсходнойПеременной ) к другой переменной (НаименованиеЦелевойПеременной). И ИсходнойПеременной, и ЦелевойПеременной могут быть списками, но не обязательно. Тип ЦелевойПеременной будет измене"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Присвоить переменную", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Присвоить переменную Присвоить переменную Оператор Присвоить переменную позволяет установить значение переменной процесса. Примечание: Инструкция Assign не поддерживает переменные продукта в экземплярах Product. Однако вы все равно можете присвоить переменной Product пустое значение (null), чтобы по"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Прикрепить", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Прикрепить Прикрепить Оператор Прикрепить позволяет прикрепить дочерний продукт к родительскому продукту. Свойства Название Описание Главный Наименование переменной родительского продукта. Подчиненный Наименование переменной дочернего продукта."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Прервать", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Прервать Прервать Оператор Прервать немедленно завершает выполнение оператора While."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Буфер", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Буфер Буфер Оператор Буфер позволяет создать временное хранилище для продуктов в виде сетки. Несколько продуктов могут входить и выходить из буфера параллельно. Транспортировка продуктов обрабатывается аналогично отчетам о транспортировке. Оператор продолжает выполнение до тех пор, пока не будет вып"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Измененить тип", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Измененить тип &nbsp; Измененить тип Оператор Измененить тип позволяет изменить экземпляр продукта на другой тип продукта как логически, так и визуально. Свойства Название Описание НаименованиеПеременнойДетали Переменная, где получить экземпляр(ы) продукта. НовыйТип Новый тип продукта для экземпляра"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Проверить сборку", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Проверить сборку Проверить сборку Проверяет, соответствует ли текущее состояние экземпляра сборки заданному порядку сборки, и сохраняет результат в переменной процесса. Переменной результата присваивается значение «Истина», когда все слоты шаблонов, выбранные в заказе на сборку, заполнены продуктами"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Комментарий", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Комментарий Комментарий Оператор Комментарий — это неисполняемый оператор, который используется для оставления комментариев о программе. Свойства Название Описание Комментарий Определяет текст комментария."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Построить", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Построить Создать (сборка) Создает пустой экземпляр сборки, а затем заполняет его заданными продуктами. Данный порядок сборки определяет как тип продукта сборки, который необходимо создать, так и слоты шаблона, в которые помещаются экземпляры продукта. Продукты помещаются в слоты шаблонов в правильн"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Продолжать", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Продолжать Продолжать Оператор Продолжать используется для возврата выполнения оператора While к его началу. Это, конечно, пропустит все остальные операторы в области видимости и переоценит условие цикла."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создать", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создать Создать Оператор Создать используется для создания нового экземпляра продукта выбранного типа продукта. Также см. поведение Генератор Деталей и оператор ТранспортВ, которые представляют собой альтернативные способы создания или передачи продуктов в процесс. &nbsp; СохранятьСмещениеИзСборки и"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Задержка", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Задержка Задержка Оператор Задержка позволяет отложить выполнение процесса на заданное время. Свойства Название Описание ИсточникВремени В качестве источника времени можно использовать свойство Распределение или Выражение. Распределение Псевдослучайное вещественное число, сгенерированное выражением,"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Открепить", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Открепить Открепить Оператор Открепить позволяет отсоединить один или несколько экземпляров продукта от общего экземпляра родительского продукта. Свойства Название Описание НаименованиеПеременнойДетали Входная переменная, из которой нужно получить экземпляр родительского продукта. ПриниматьВсеВидыДе"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Процесс", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Процесс Процесс Оператор Процесс позволяет вам обновлять поведение статистики и записывать данный продукт (ы), перемещаемый в или из контейнера компонентов. Если НаименованиеПеременнойДетали является списком, все продукты в списке записываются одновременно. Свойства Название Описание НаименованиеПер"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Получить сборку", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Получить сборку Получить сборку Создает объект «Порядок сборки», который определяет подмножество сборки, которое можно передат озврата выполнения оператора While к его началу. При этом будут пропущены все остальные операторы в области видимости и пересчитано условие цикла."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Определить базу", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Определить базу Определить базу Оператор Определить базу изменяет свойства &nbsp;системы координат базы робота во время симуляции. Когда вы сбрасываете симуляцию, система координат базы возвращается в исходное положение. Примечание: Систему координат базы можно использовать в качестве базовой систем"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Определить инструмент", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Определить инструмент Определить инструмент Оператор Определить инструмент изменяет свойства системы координат инструмента в роботе во время симуляции. Когда вы сбрасываете симуляцию, система координат инструмента возвращается в исходное положение. Примечание: Систему координат инструмента можно исп"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Задержка", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Задержка Задержка Оператор Задержка задерживает выполнение программы робота на заданное время. Свойства Название Описание Задержка Определяет время задержки (в секундах)."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Остановка", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Остановка Остановка Оператор Остановка может остановить симуляцию. Свойства Название Описание ОстановитьСимуляцию Включает/выключает остановку симуляции. СброситьСимуляцию Включает/выключает сброс симуляции."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Если", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Если Если Оператор Если (If) выполняет область Then , Else , или Else If на основе условия. Оператор инициализирует области с Then и Else .Один или несколько диапазонов Else If можно добавить, щелкнув значок «+», который отображается при наведении указателя мыши на оператор If. Каждая область Else I"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Линейное движение", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Линейное движение Линейное движение Оператор Линейное движение — это движение, при котором робот использует свою текущую конфигурацию для достижения положения на кратчайшем возможном расстоянии. Пример. Линейное движение робота от P1 до P2 Свойства Позиция Название Описание Позиция Определяет матриц"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Движение по траектории", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Движение по траектории Движение по траектории Оператор Движение по траектории позволяет добавлять и редактировать позиции робота вдоль кривых и биссектрис геометрии. Для получения дополнительной информации см. Обучение робота пути ."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Движение от точки к точке", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Движение от точки к точке Движение от точки к точке Оператор Движение от точки к точке — это движение, при котором робот интерполирует свои совместные значения для достижения положения. Пример. Пошаговое перемещение робота из точки P1 в точку P2. Свойства Позиция Название Описание Позиция Определяет"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Печать", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Печать Печать Оператор Печать печатает сообщение на панели вывода. Свойства Название Описание Комментарий Определяет текст сообщения."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Синхронизация Программы", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Синхронизация Программы &nbsp; Синхронизация Программы Оператор Синхронизация Программы позволяет синхронизировать выполнение программы робота с программами других роботов. Свойства Название Описание СинхронизацияСообщения Определяет сообщение для запуска синхронизации. Все компоненты в Синхронизаци"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Возврат", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Возврат Возврат Оператор Возврат (Return) завершает выполнение подпрограммы. В большинстве случаев вы должны использовать оператор Return для завершения выполнения вызванной подпрограммы в программе робота."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "ОПЕРАТОРЫ РОБОТА", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "ОПЕРАТОРЫ РОБОТА Операторы Робота СОДЕРЖАНИЕ ПРИСВОИТЬ ПЕРЕМЕННУЮ ПРЕРВАТЬ ВЫЗОВ ПОДПРОГРАММЫ КОММЕНТАРИЙ ПРОДОЛЖИТЬ ОПРЕДЕЛИТЬ БАЗУ ОПРЕДЕЛИТЬ ИНСТРУМЕНТ ЗАДЕРЖКА ОСТАНОВКА ЕСЛИ ЛИНЕЙНОЕ ДВИЖЕНИЕ ДВИЖЕНИЕ ПО ТРАЕКТОРИИ ДВИЖЕНИЕ ОТ ТОЧКИ К ТОЧКЕ ПЕЧАТЬ СИНХРОНИЗАЦИЯ ПРОГРАММЫ ВОЗВРАТ УСТАНОВИТЬ БИНА"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Установить бинарный выход", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Установить бинарный выход Установить бинарный выход Оператор Установить бинарный выход &nbsp;устанавливает значение сигнала, сопоставленного с выходным портом в роботе. Свойства Название Описание ВыходнойПорт Определяет выходной порт робота, установленный оператором. ВыходноеЗначение Определяет знач"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Установить статистику", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Установить статистику Установить статистику Оператор Установить статистику позволяет вам установить состояния статистики для робота. Свойства Название Описание Статистика Выберите поведение статистики, которое будет использоваться в компоненте. Состояние Выберите текущее состояние робота. Новые сост"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Переключатель случаев", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Переключатель случаев Переключатель случаев (Оператор Switch-Case) Оператор Switch-Case позволяет выполнить одну из предопределенных областей на основе оцениваемого значения выражения Условия. Каждая область действия определяет тест для значения условия, и первый случай, в котором тест пройден, т.е."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Ожидать бинарный вход", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Ожидать бинарный вход Ожидать бинарный вход Оператор Ожидать бинарный вход &nbsp;задерживает выполнение программы робота до тех пор, пока значение сигнала, отображаемого на входной порт в роботе, не будет иметь определенное значение. Оценка входного порта может быть циклической или запускаться сигна"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Пока", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Пока Пока Оператор Пока (While) выполняет область операторов в цикле, пока условие истинно. Свойства Название Описание Условие Определяет выражение, которое при оценке возвращает значение True или False. Значение True выполняет область операторов, а затем программа возвращается назад и переоценивает"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Обзор", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Обзор Обзор&nbsp; Поведение выполняет задачу в компоненте. Поведения содержатся в узлах, но на них можно ссылаться и связывать с другими поведениями в компоненте или других компонентах. Например, сигналы могут быть связаны с дат RU", "title": "Создание паттерна компонентов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание паттерна компонентов Создание паттерна компонентов Выбранные объекты в смоделированной среде можно клонировать для формирования углового или линейного паттерна компонентов. 1. В сцене выберите объект, который хотите клонировать. 2. На вкладке Главная в группе Инструменты щелкните Паттерн . "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование свойств компонентов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование свойств компонентов Редактирование свойств компонентов Панель свойств позволяет редактировать расположение и свойства выбранного компонента в трехмерном мире. Если выбранный компонент содержит два или более наборов свойств, каждый набор будет отображаться в виде вкладки на панели свой"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование исходной точки компонента", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование исходной точки компонента Редактирование исходной точки компонента Исходная точка компонента может быть привязана и перемещена в другое место в трехмерном мире. Привязка позволяет выбрать новое местоположение для начала компонента. 1. В 3D-мире выберите компонент, который вы хотите от"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Экспорт геометрии компонентов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Экспорт геометрии компонентов Экспорт геометрии компонентов Геометрия одного или нескольких выбранных компонентов может быть экспортирована в новый, поддерживаемый тип файла. 1. В 3D-мире выберите компоненты, которые вы хотите экспортировать. 2. На вкладке Главная в группе Экспорт нажмите Геометрия "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Группировка компонентов", "ur ов в области Команда Выделить позволяет вам выбирать области в трехмерном мире и отключать другие режимы, которые могут перемещать или иным образом изменять компоненты. При использовании выделения области компоненты должны занимать значительное мест"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выбор компонентов из списка", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выбор компонентов из списка Выбор компонентов из списка Панель Дерево построения можно использовать для выбора компонентов, управления видимостью компонентов и блокировки компонентов от редактирования. На панели Дерево построения компоненты в 3D-мире перечислены и отсортированы по имени и сгруппиров"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Привязка компонентов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Привязка компонентов Привязка компонентов Выбранный компонент может быть привязан к местоположению относительно других компонентов в трехмерном мире. 1. В 3D-мире выберите компоненты, которые вы хотите переместить. 2. На вкладке Главная , в группе Инструменты , нажмите Привязка . 3. На панели задач "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Доступ к функции Подключения", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Доступ к функции Подключения Доступ к функции Подключения Доступ к функции Подключение и ее командам можно получить на вкладке Подключение, которая появляется над лентой. Если вкладка «Подключение» не отображается, необходимо либо включить эту функцию, либо перезапустить Рациональное Производство. С"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Подключение к серверу OPC UA", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Подключение к серверу OPC UA Подключение к серверу OPC UA&nbsp; Плагин OPC UA позволяет подключить работающий сервер OPC UA. жмите Аддоны , а затем в Подключения , сделайте одно из следующих действий: &#183; Чтоб"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Подключение к контроллеру робота Fanuc", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Подключение к контроллеру робота Fanuc Подключение к контроллеру робота Fanuc 1. О плагине Плагин Fanuc Robot позволяет подключаться к контроллеру робота Fanuc во время моделирования и обмена данными. Например, программа, работающая в виртуальном или физическом контроллере Fanuc, может управлять сое"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Блокировка значений переменных", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Блокировка значений переменных Блокировка значений переменных Блокировка позволяет установить фиксированные значения для пар переменных. Фиксированное или заблокированное значение используется, когда исходная и целевая переменные в паре синхронизируются друг с другом. Значения переменных моделирован"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Пары переменных", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Пары переменных Пары переменных Группа переменных в подключаемом модуле используется для связывания переменных моделирования с переменными сервера. Это означает, что значение свойства или сигнала в компоненте может быть связано со значением переменной, доступной в подключенном ПЛК или сервере. 1. На"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Обратная совместимость", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Обратная совместимость Обратная совместимость&nbsp; Если вы обновляете планировку, созданную с помощью более старой версии аддона St&#228;ubli, см. следующую информацию об обратной совместимости. Проблема Объяснение В новом аддоне используется тот же формат сохранения конфигурации, что и в старом ад"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Соединения CS8/CS9", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Соединения CS8/CS9 Соединения CS8/CS9 Если вы используете аддон St&#228;ubli с реальным или эмулированным контроллером St&#228;ubli CS8/CS9, обратитесь к следующим пунктам за рекомендациями по техническим вопросам и вопросам разработки. 1. Связь осуществляется с использованием протоколов TCP/IP, HTT"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Начало работы", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Начало работы Начало работы СОДЕРЖАНИЕ ШАГ 1. НАСТРОЙКА ПАКЕТА STAUBLI ROBOTICS SUITE ШАГ 2. ВКЛЮЧИТЬ АДДОН STAUBLI ШАГ 3. ДОСТУП К АДДОНУ STAUBLI ШАГ 4. ПОДКЛЮЧЕНИЕ К КОНТРОЛЛЕРУ STAUBLI ШАГ 5. СОЕДИНЕНИЕ С РОБОТОМ ШАГ 6. ПРОГРАММИРОВАНИЕ РОБОТА ШАГ 7. ПОСТПРОЦЕССОР Шаг 1. Настройка пакета St&#228;"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Постпроцессор", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Постпроцессор Постпроцессор&nbsp; Дополнение St&#228;ubli позволяет перевести программу робота в 3D-мир в приложение VAL 3. Это называется постобработкой программы робота. Созданное приложение VAL 3 представляет собой набор XML-файлов, образующих проект, который можно открыть в St&#228;ubli Robotics"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Дополнение St&#228;ubli", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Дополнение St&#228;ubli Дополнение St&#228;ubli Дополнение St&#228;ubli позволяет взаимодействовать с контроллером робота St&#228;ubli. Например, вы можете программировать роботов в трехмерном мире, а также тестировать, моделировать и постобрабатывать приложения VAL 3. &nbsp; СОДЕРЖАНИЕ НАЧАЛО РАБОТ"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Пользовательский интерфейс", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Пользовательский интерфейс Пользовательский интерфейс&nbsp; СОДЕРЖАНИЕ КОНФИГУРАЦИЯ ЯЧЕЙКИ STAUBLI ХАРАКТЕРИСТИКИ ИЗМЕНИТЬ ПОДКЛЮЧЕННОГО РОБОТА СОЗДАТЬ ПРИЛОЖЕНИЕ VAL 3 ОТОБРАЖЕНИЕ ВХОДОВ/ВЫХОДОВ КОНТРОЛЛЕРА STAUBLI РЕДАКТОР СОПОСТАВЛЕНИЙ ВВОДА/ВЫВОДА Конфигурация ячейки St&#228;ubli Панель &nbsp;Ко"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Поддерживаемые типы данных", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Поддерживаемые типы данных Поддерживаемые типы данных&nbsp; На стороне симуляции вы можете подключить свойства компонентов, сигналы, базы контроллеров и инструменты. Эти переменные симуляции могут быть подключены к внешнему программному обеспечению и устройствам через подключаемые модули. Функция по"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Терминология", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Терминология Терминология Обратите внимание на следующие термины и их контекст: &#183; Симуляция . Относится либо к симулированию трехмерного мира, либо к самому продукту Рациональное Производство. &#183; Сервер . Относится либо к ПЛК, либо к серверу. &#183; ПК Симуляции . Устройство с Рациональным "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Плагин Universal Robots RTDE", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Плагин Universal Robots RTDE Плагин Universal Robots RTDE&nbsp; Плагин Universal Robots RTDE позволяет подключать контроллеры роботов Universal Robot серии CB3 с интерфейсом RTDE. Вы также можете подключить симулятор контроллера робота URSim с интерфейсом RTDE. Например, вы можете установить соедине"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Подключение к ПЛК Siemens серии S7", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Подключение к ПЛК Siemens серии S7 Подключение к ПЛК Siemens серии S7 Плагин Siemens S7 позволяет подключаться к ПЛК Siemens серии S7, используя протокол связи S7 (S7comm). Более конкретно, он использует функции &quot;PUT&quot; и &quot;GET&quot; протокола S7comm. Он основан на TCP/IP и работает чере"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание аннотации", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание аннотации Создание аннотации&nbsp; Аннотация позволяет создать визуальную выноску или разметку для пояснения одного или нескольких элементов чертежа. 1. На вкладке Чертеж , сделайте одно из следующих действий: &#183; Чтобы создать аннотацию в форме прямоугольника, в группе Аннотации , нажми"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание размеров", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание размеров Создание размеров Размер позволяет визуализировать расстояния и углы между линиями, точками и ребрами на чертежах. 1. На вкладке Чертеж , в группе Измерение , сделайте одно из следующих действий: &#183; Чтобы создать размер для измерения угла между двумя линиями, щелкните Угловой ."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание чертежа", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание чертежа Создание чертежа&nbsp; Чертеж — это проекция компонентов в трехмерном мире с использованием наборов двухмерных линий. Как правило, вы можете автоматически создавать чертежи для планировки в трехмерном мире, используя стандартные виды. 1. На вкладке Чертеж , в группе Создать вид , сд"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание шаблона чертежа", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание шаблона чертежа Создание шаблона чертежа &nbsp; Существующий шаблон чертежа можно использовать в качестве руководства для разработки новых. Так же добавить/удалить файлы из папки, содержащей шаблоны чертежей вашего приложения (C:\\Users\\&lt;пользователь&gt;\\Documents\\R-Pro\\0.2\\My Templates\\D"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "ЧЕРТЕЖИ", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "ЧЕРТЕЖИ Чертежи СОДЕРЖАНИЕ СОЗДАНИЕ ИЗМЕРЕНИЯ СОЗДАНИЕ ЧЕРТЕЖА СОЗДАНИЕ ШАБЛОНА ЧЕРТЕЖА СОЗДАНИЕ АННОТАЦИИ ЭКСПОРТ ЧЕРТЕЖА ПОИСК ШАБЛОНА ЧЕРТЕЖА ИМПОРТ ШАБЛОНА ЧЕРТЕЖА ПЕЧАТЬ ЧЕРТЕЖА"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Экспорт чертежа", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Экспорт чертежа Экспорт чертежа&nbsp; Чертежи можно экспортировать как новый поддерживаемый тип файла. 1. Если вы хотите экспортировать определенный набор чертежей, выберите чертежи непосредственно в мире чертежей; Вы можете удерживать нажатой клавишу CTRL, чтобы добавить/удалить рисунок из выделени"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Поиск шаблона чертежа", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Поиск шаблона чертежа Поиск шаблона чертежа&nbsp; Шаблоны чертежей, используемые Рациональным Производством, находятся в C:\\Users\\&lt;пользователь&gt;\\Documents\\R-Pro\\0.2\\My Templates\\Drawings. Так же при установке или после удаления крнфигурации ПО шаблоны копируются из папки C:\\Program Files (x86)"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Импорт шаблона чертежа", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Импорт шаблона чертежа Импорт шаблона чертежа&nbsp; Шаблон чертежа позволяет масштабировать чертежи, генерировать спецификацию (BOM) и экспортировать готовый к печати документ или файл САD для ваших чертежей. 1. На вкладке Чертеж , в группе Чертеж , нажмите Загрузить шаблон . 2. На панели задач Импо"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Печать чертежа", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Печать чертежа Печать чертежа &nbsp; Чертеж можно экспортировать для создания документа, готового к печати. Как правило, шаблон используется для печати одного или нескольких чертежей в виде листа. 1. На вкладке Чертеж , в группе Печать , нажмите Чертеж . 2. В Предварительном просмотре печати , выпол"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Закрытие планировки", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Закрытие планировки Закрытие планировки Планировка всегда открыта в трехмерном мире. Это означает, что закрытие одной планировки в 3D-мире открывает новую пустую планировку в 3D-мире. 1. Нажмите на вкладке Файл , а затем на панели Навигация , нажмите Выход . 2. В подсказке, сделайте одно из следующи"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание 3D-размера", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание 3D-размера Создание 3D-размера&nbsp; Размер позволяет визуализировать расстояния и углы между линиями, точками и ребрами в мире моделирования. 1. На вкладке Главная , в группе Размеры , выберите одно из следующих действий: &#183; Линейный , чтобы измерить расстояние. &#183; Угловое , чтобы "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Экспорт геометрии планировки", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Экспорт геометрии планировки Экспорт геометрии планировки&nbsp; Геометрию всей планировки можно экспортировать как файл поддерживаемого типа. 1. На вкладке Главная , в группе Экспорт , нажмите Геометрия . 2. На панель задач Экспорт планировки , в поле Компонент нажмите Все . 3. В списке Формат файла"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "ПЛАНИРОВКА", "url": "", емая роботом и другими типами компонентов для упрощения расположения в области. То есть вы можете использовать базовую рамку в качестве локальной системы координат для оп"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Добавление и редактирование рамок инструментов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Добавление и редактирование рамок инструментов Добавление и редактирование рамок инструментов Рамка инструмента — это точка отсчета, используемая роботами и другими типами компонентов для позиционирования объектов. Как правило, инструментальная рамка используется с манипулятором для перемещения робо"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Назначение соединения контроллеру", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Назначение соединения контроллеру Назначение соединения контроллеру&nbsp; Соединение узла может быть назначено поведению робота или сервоконтроллера, таким образом, движение этого соединения может управляться контроллером. 1. В трехмерном мире выберите компонент. 2. Нажмите на вкладку Моделирование "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Сворачивание объектов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Сворачивание объектов Сворачивание объектов&nbsp; Сворачивание позволяет объединить выбранный элемент и его дочерние элементы в один элемент геометрии. Это, конечно, удалит иерархию свернутых элементов. 1. Выберите элемент. Вы можете выбрать несколько элементов, но это не приведет к объединению выбр"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание нового поведения", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание нового поведения Создание нового поведения &nbsp; Поведение — это действие или набор действий, которые компонент может выполнять до или во время симуляции. 1. Либо создайте мире. 2. На вкладке Моделирование , в"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Удаление геометрии", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Удаление геометрии Удаление геометрии &nbsp; Удаление позволяет упростить тесселяцию геометрии в пространственных объектах путем слияния ребер и удаления лишних вершин. Операция попытается объединить все точки в пределах максимальной допустимой погрешности для достижения желаемого качества, а затем "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Определение смещения звена", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Определение смещения звена Определение смещения звена Команда Переместить , другие инструменты и свойства могут использоваться для определения свойства Смещение выбранного узла и его соединения. 1. В трехмерном мире выберите компонент. 2. Нажмите на вкладку Моделирование , а затем в панели Диаграмма"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование дерева элементов узла", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование дерева элементов узла Редактирование дерева элементов узла&nbsp; Дерево элементов выбранного узла можно редактировать с помощью мыши и быстрых команд. СОДЕРЖАНИЕ ПЕРЕМЕЩЕНИЕ РАЗВЕРНУТЬ СГРУППИРОВАТЬ УДАЛИТЬ ПУСТЫЕ Перемещение Вы можете перетаскивать объекты на разную глубину и уровни "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Извлечение геометрии в новый компонент", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Извлечение геометрии в новый компонент Извлечение геометрии в новый компонент&nbsp; Извлечение позволяет перегруппировать выбранные элементы/звенья в новые компоненты. Как правило, извлечение используется, когда детали и сборки в импортированном файле САПР не были сформированы в отдельные компоненты"}, {"category": "R-P "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Поиск данных компонента", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Поиск данных компонента Поиск данных компонента &nbsp; В верхней части каждой панели панели Диаграмма компонента находятся инструменты для поиска и фильтрации данных в выбранном компоненте. 1. В трехмерном мире выберите компонент. 2. Перейдите на вкладку Моделирование , а затем на панели Диаграмма к"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выбор поведения в компоненте", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выбор поведения в компоненте Выбор поведения в компоненте&nbsp; Вам нужно использовать панель Диаграмма компонента для выбора поведения в компоненте. 1. В трехмерном мире выберите компонент. 2. Щелкните вкладку Моделирование , а затем в панели Диаграмма компонента , Дерево узлов компонента , разверн"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выбор элементов в компоненте", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выбор элементов в компоненте Выбор элементов в компоненте &nbsp; Контекст сцены при моделировании компонента позволяет напрямую выбирать элемент любого компонента в трехмерном мире. В некоторых случаях вы не можете напрямую выбрать элемент, если он не занимает места и визуально не представляет геоме"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выбор узлов в компоненте", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выбор узлов в компоненте Выбор узлов в компоненте &nbsp; Вы можете использовать панель Диаграмма компонента для выбора узлов в компоненте. Полезно использовать команду Переместить для отображения смещения и оси соединения выбранного узла в 3D-мире, тогда как команду Показать раздела Структура можно "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выбор свойств в компоненте", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выбор свойств в компоненте Выбор свойств в компоненте &nbsp; Вам нужно использовать панель Диаграмма компонента для выбора свойств в компоненте. Когда свойство выбрано, его свойства будут отображаться на панели задач Свойства. В противном случае любые видимые свойства компонента могут быть прочитаны"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Упрощение геометрии", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Упрощение геометрии Упрощение геометрии &nbsp; Геометрию объекта можно упростить, чтобы уменьшить количество данных и визуализировать его максимальный объем. 1. Выберите одну или несколько элементов в компоненте. 2. На вкладке Моделирование в группе Геометрия , щелкните стрелку Инструменты, а потом "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Срезать геометрию", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Срезать геометрию Срезать геометрию Геометрию элемента можно разрезать и разделить на новые элементы геометрии. 1. Выберите одну или несколько элементов в компоненте. 2. На вкладке Моделирование в группе Геометрия , щелкните стрелку Инструменты , а потом под Инструменты элементов , нажмите Срез . 3."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Разделить элемент", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Разделить элемент Разделить элемент Разделение позволяет перегруппировать геометрию объектов в новые объекты. Геометрия должна содержаться в элементе геометрии, чтобы ее можно было разделить, иначе вам придется сначала свернуть объект, прежде чем разбивать его геометрию. 1. Выберите корневой узел ко"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Перенос компонентов в другие компоненты", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Перенос компонентов в другие компоненты Перенос компонентов в другие компоненты &nbsp; Поведения, которые поддерживают материальный поток, могут быть подключены для передачи компонентов от одного компонента к другому с помощью поведения типа интерфейса. 1. В трехмерном мире выберите компонент. 2. На"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Перенос компонентов в другие поведения", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Перенос компонентов в другие поведения Перенос компонентов в другие поведения &nbsp; Поведения, поддерживающие поток материалов, можно подключить к компонентам для передачи внутри компонента путем редактирования свойств коннекторов. 1. В трехмерном мире выберите компонент. 2. Нажмите на вкладку Моде"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Использование внешнего редактора Python", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Использование внешнего редактора Python Использование внешнего редактора Python &nbsp; Чтобы использовать внешний редактор Python, перейдите в настройки: ФАЙЛ - Настройки- Общие - Конфигурация. В опции Редактор скриптов Python , выберите Внешний редактор . В параметре Системные установки по умолчани"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Кабели в мире физики", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Кабели в мире физики Кабели в мире физики&nbsp; Рациональное Производство поддерживает использование ремней, проводов и других типов объектов, реализованных как поведение физического кабеля. Геометрия Каждый кабель генерируется с собственным набором геометрии. Геометрия кабеля состоит из капсул, кот"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Столкновения в мире физики", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Столкновения в мире физики Столкновения в мире физики&nbsp; ГеометрияСтолкновения - это объект, который может реагировать на физические объекты во время симуляции. Каждая ГеометрияСтолкновения представляет собой оболочку, охватывающую геометрию элемента в компоненте. Каждый элемент, включая корневой"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Группы Столкновений в мире физики", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Группы Столкновений в мире физики Группы Столкновений в мире физики &nbsp; Столкновение может произойти между любым физическим объектом, имеющим свойство ГеометрияСтолкновения, и поведением объекта Physics Entity. Свойства поведения физического объекта можно использовать для включения/исключения узл"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Суставы в мире физики", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Суставы в мире физики Суставы в мире физики &nbsp; Рациональное Производство поддерживает использование соединений D6, которые реализованы как поведение Physics Joint. Эти типы соединений могут иметь пользовательские определения и поддерживать несколько степеней свободы. 1. В трехмерном мире выберит"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Пути в физическом мире", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Пути в физическом мире Пути в физическом мире&nbsp; Движение и поток компонентов с физическими свойствами можно реализовать с помощью поведения Physics Path. Это позволяет применять контактные силы к компонентам, движущимся по траекториям. Например, вы можете выталкивать, отклонять, делить, сбрасыва"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "ФИЗИКА", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "ФИЗИКА Физика СОДЕРЖАНИЕ МИР ФИЗИКИ КАБЕЛИ В МИРЕ ФИЗИКИ ГРУППЫ СТОЛКНОВЕНИЙ В МИРЕ ФИЗИКИ СТОЛКНОВЕНИЯ В МИРЕ ФИЗИКИ СУСТАВЫ В МИРЕ ФИЗИКИ ПУТИ В ФИЗИЧЕСКОМ МИРЕ"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Мир физики", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Мир физики Мир физики&nbsp; В Рациональном Производстве в трехмерной среде существует мир симуляции и мир физики. Такое сосуществование позволяет компонентам действовать независимо от физических сил. Кроме того, компоненты могут перемещаться в мир симуляции и из него в мир физики. Обычно это происхо"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Моделирование процессов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Моделирование процессов Моделирование процессов Моделирование процессов позволяет вам управлять деталями, процессами и потоками процессов на планировке. Эта функция оптимизирует процесс создания планировки с помощью визуализированного рабочего процесса, быстрой настройки симуляции и улучшенной произ"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Терминология", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Терминология Терминология Обратите внимание на следующие термины и их контекст: &#183; Редактор процессов. Графический интерфейс пользователя для исполнителя процесса &#183; (Процесс) Оператор. Одиночный шаг выполнения в программе &#183; (Процесс) Процедура. Исполняемая последовательность операторов"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Использование переменных процесса", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Использование переменных процесса Использование переменных процесса&nbsp; Переменные процесса являются локальными переменными в процессе, специфичном для процедуры. Переменная в процедуре может быть установлена и на нее можно ссылаться только в одной и той же процедуре. Однако, как операторы требова"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Вызов подпрограмм в программе робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Вызов подпрограмм в программе робота Вызов подпрограмм в программе робота&nbsp; Чтобы подпрограмма была выполнена, она должна быть вызвана либо основной подпрограммой, либо другой подпрограммой, которая выполняется в программе робота. 1. Нажмите на вкладку Программа, а затем выберите в трехмерном ми"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Подключение внешних осей", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Подключение внешних осей Подключение внешних осей &nbsp; Робот может быть удаленно подключен к внешним кинематическим компонентам, например, устройствам позиционирования заготовки, с помощью абстрактных интерфейсов. Рабочий процесс подключения внешних осей к роботу аналогичен удаленному подключению "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Подключение сигналов к входам/выходам робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Подключение сигналов к входам/выходам робота Подключение сигналов к входам/выходам робота &nbsp; Редактор сигналов робота можно использовать для подключения сигналов других компонентов в качестве входов и выходов. При подключении входов и выходов редактор сигналов робота позволяет изменить порт ввод"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание операторов в программе робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание операторов в программе робота Создание операторов в программе робота &nbsp; Оператор — это команда, выполняемая роботом в своей программе. Операторы в программе робота содержатся в подпрограммах и выполняются по порядку один за другим. Явные переменные и другие свойства робота, включая порт"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Создание подпрограмм в программе робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Создание подпрограмм в программе робота Создание подпрограмм в программе робота&nbsp; Подпрограмма содержит последовательность операторов, которые может выполнить робот. Подпрограммы необходимо вызывать в основной процедуре программы робота либо напрямую, либо с помощью другой подпрограммы, чтобы он"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Обнаружение столкновений", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Обнаружение столкновений Обнаружение столкновений Столкновения между роботом и другими компонентами можно обнаружить в 3D-мире с помощью глобальных настроек и детекторов. Детектор — это тест на коллизии между двумя списками, A и B, каждый из которых содержит узлы. Геометрия узлов в списке A сравнива"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование координат базы и инструмента", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование координат базы и инструмента Редактирование координат базы и инструмента Команда «Переместить» и другие инструменты могут использоваться для редактирования базы робота и рамок инструментов. 1. Нажмите на вкладку Программирование , а затем панель Взаимодействие , выберите базу или инст"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование позиций робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование позиций робота Редактирование позиций робота Расположение линейных и двухточечных позиций робота в программе можно редактировать с помощью команд Переместить, Взаимодействие и других инструментов. 1. Нажмите на вкладку Программирование , а затем выполните одно или несколько следующих "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование операторов в программе робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование операторов в программе робота Редактирование операторов в программе робота Операторы в программе робота можно редактировать с помощью панели Свойства . 1. Нажмите на вкладку Программирование , а затем используйте Взаимодействие выберите робота, которого вы хотите запрограммировать в т"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Замена роботов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Замена роботов Замена роботов Робот может быть заменен другим роботом в 3D-мире. При обмене роботами совместимый робот будет выделен желтым цветом в трехмерном мире, что означает, что его можно обменять на выбранного робота. 1. В 3D-мире выберите робота. 2. На вкладке Программирование , в группе Инс"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Ограничения для соединений робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Ограничения для соединений робота Ограничения для соединений робота&nbsp; Ограничение — это механизм позволяющий отслеживать превышение некоторых параметров или положений в пространстве для робота. Как правило, когда вы программируете робота, ограничения используются для обнаружения и отображения по"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Блокировка позиций робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Блокировка позиций робота Блокировка позиций робота&nbsp; Глобальную настройку можно использовать для блокировки позиций робота в трехмерном мире. То есть позиции робота могут сохранить свое местоположение, если вы переместите ее родителя, например, робота или базовую рамку. &#183; На вкладке Програ"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Сопоставление сигналов с действиями в роботе", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Сопоставление сигналов с действиями в роботе Сопоставление сигналов с действиями в роботе Ввод-вывод робота можно сопоставить с базой и инструментальной рамкой для выполнения действий, специфичных для инструмента. Например, вы можете использовать оператор Set Binary Output, чтобы сигнализировать о з"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Покраска", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Покраска Покраска&nbsp; Аддон Покрасить позволяет подготавливать, симулировать и анализировать результаты процессов покраски с помощью робота и покрасочного пистолета. СОДЕРЖАНИЕ ВКЛЮЧИТЬ АДДОН ДОСТУП К РЕЖИМУ РИСОВАНИЯ ПОДГОТОВЬТЕ КОМПОНЕНТЫ ОПРЕДЕЛИТЬ ВИЗУАЛИЗАЦИЮ PAINT ИЗМЕРЬТЕ ТОЛЩИНУ КРАСКИ УДА"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "РОБОТЫ", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "РОБОТЫ Роботы СОДЕРЖАНИЕ ВЫЗОВ ПОДПРОГРАММ В ПРОГРАММЕ РОБОТА ПОДКЛЮЧЕНИЕ ВНЕШНИХ ОСЕЙ ПОДКЛЮЧЕНИЕ СИГНАЛОВ К ВХОДАМ/ВЫХОДАМ РОБОТА СОЗДАНИЕ ОПЕРАТОРОВ В ПРОГРАММЕ РОБОТА СОЗДАНИЕ ПОДПРОГРАММ В ПРОГРАММЕ РОБОТА ОБНАРУЖЕНИЕ СТОЛКНОВЕНИЙ РЕДАКТИРОВАНИЕ КООРДИНАТ БАЗЫ И ИНСТРУМЕНТА РЕДАКТИРОВАНИЕ ПОЗИЦ"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выберите робота и его данных", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выберите робота и его данных Выберите робота и его данных&nbsp; Робота и его данные можно выбрать, как и любой другой компонент в трехмерном мире. Вам нужно использовать команду Взаимодействие для выбора и управления роботом в трехмерном мире. Тогда как команда Переместить будет выбирать и перемещат"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Выбор операторов в программе робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Выбор операторов в программе робота Выбор операторов в программе робота&nbsp; Панель редактора программ испол е используются для обучения робота позициям, а также для настройки суставов робота. А так же включает в себя внешние соединения, подключенные к роботу. 1. "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Обучение позициям с использованием параметров привязки", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Обучение позициям с использованием параметров привязки Обучение позициям с использованием параметров привязки&nbsp; Команда Взаимодействие позволяет использовать манипулятор для обучения роботов позициям. В основании манипулятора находится тор (кольцо) пурпурного цвета, который позволяет перемещать "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Использование переменных подпрограммы", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Использование переменных подпрограммы Использование переменных подпрограммы Переменные можно добавлять в подпрограммы в программе робота, а затем использовать для усложнения и определения условий для операторов If и While. Переменная подпрограммы — это локальная переменная программы робота, и ее нел"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Визуализация траектории движения робота", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Визуализация траектории движения робота Визуализация траектории движения робота&nbsp; Путь робота к целям и от них можно визуализировать в трехмерном мире. &#183; На вкладке Программирование, в группе Показать, выполните одно или несколько из следующих действий: &#183; Чтобы показать направление меж"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Визуализация объема обнаружения инструмента", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Визуализация объема обнаружения инструмента Визуализация объема обнаружения инструмента Свойство ОбъемОбнаружения визуализирует объем обнаружения вы le": "СИМУЛЯЦИЯ", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "СИМУЛЯЦИЯ Симуляция СОДЕРЖАНИЕ АНИМАЦИЯ ДВИЖЕНИЯ КАМЕРЫ ЭКСПОРТ СИМУЛЯЦИИ КАК ИЗОБРАЖЕНИЯ ПЕЧАТЬ СИМУЛЯЦИИ В ВИДЕ ИЗОБРАЖЕНИЙ ЗАПИСЬ СИМУЛЯЦИИ В ФОРМАТЕ 3D PDF ЗАПИСЬ СИМУЛЯЦИИ КАК АНИМАЦИИ ЗАПИСЬ СИМУЛЯЦИИ В КАЧЕСТВЕ ВИДЕО ПОВТОРЕНИЕ СИМУЛЯЦИИ ЗАПУСК СИМУЛЯЦИИ ТРАНСЛЯЦИЯ АНИМАЦИИ ИСПОЛЬЗОВАНИЕ ВРЕМ"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Трансляция анимации", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Трансляция анимации Трансляция анимации&nbsp; Можно транслировать 3D-сцену в прямом эфире на клиентское средство просмотра. Шаг 1. Включить потоковую передачу анимации Функция Animation Streaming может быть включена/выключена с помощью параметра в настройках. 1. Нажмите на вкладку Файл, а затем на п"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Использование времени выполнения симуляции", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Использование времени выполнения симуляции Использование времени выполнения симуляции Среда выполнения позволяет вам определить, как долго будет выполняться симуляция в трехмерном мире. 1. В 3D мире, на элементах управления Симуляцией , нажмите Настройки. 2. В разделе Режим отображения часов, выбери"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Использование времени начала симуляции", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Использование времени начала симуляции Использование времени начала симуляции Время начала симуляции позволяет начать симуляцию по истечении определенного времени в трехмерном мире. Это позволяет запускать симуляцию до, после или во время процесса. 1. В 3D мире, на элементах управления Симуляцией, н"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "ЗАДАЧИ", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "ЗАДАЧИ Задачи COДЕРЖАНИЕ КATAЛОГ КOMПОНЕНТЫ ПОДКЛЮЧЕНИЯ ЧЕРТЕЖИ ПЛАНИРОВКА МОДЕЛИРОВАНИЕ ФИЗИКА МОДЕЛИРОВАНИЕ ПРОЦЕССОВ РОБОТЫ СИМУЛЯЦИЯ РАБОЧАЯ СРЕДА"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Клонирование выбранных объектов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Клонирование выбранных объектов Клонирование выбранных объектов&nbsp; Выбранные объекты в смоделированной среде можно клонировать, чтобы быстро создать дубликат или выполнить действие копирования-вставки. 1. В среде симуляции, &nbsp;сделайте одно из следующих действий: &#183; Чтобы клонировать один "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Копирование и вставка выделенного", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Копирование и вставка выделенного Копирование и вставка выделенного&nbsp; Выбранные объекты можно скопировать, а затем вставить как новое содержимое. В большинстве случаев содержимое, вставленное из буфера обмена, всегда добавляется со смещением относительно исходного содержимого. 1. В сцене выберит"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Удаление выделенного", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Удаление выделенного Удаление выделенного Определенные типы объектов и данных могут быть навсегда удалены из сцены. 1. В сцене выберите объекты, которые хотите удалить. 2. Сделайте одно из следующих действий: &#183; Нажмите кнопку клавиатуры УДАЛИТЬ. &#183; На Ленте, в группе быстрый доступ, нажмите"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Определение единиц и величин", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Определение единиц и величин Определение единиц и величин Система измерения единиц и величин в Рациональном Производстве определяется как система единиц измерения. В каждой системе единиц есть группы единиц. Каждая единица определяется величиной, которая является либо скалярной (величина), либо вект"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование настроек", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование настроек Редактирование настроек Настройки — это параметр, который можно изменить и сохранить в качестве предпочтения для Рационального Производства. 1. Нажмите на вкладку Файл, а затем на панели Навигация, нажмите Настройки. 2. Щелкните раздел параметров, который вы хотите изменить, "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Стыковка панели", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Стыковка панели Стыковка панели&nbsp; Вы можете закрепить панель в области, указанной диспетчером стыковки. Это можно сделать для любой панели, которая закреплена или свободно плавает в главном окне. То есть незакрепленные или скрытые панели должны сначала отображаться, прежде чем их можно будет зак"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактирование панелей по контексту", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактирование панелей по контексту Редактирование панелей по контексту&nbsp; Параметр Включить независимость позволяет редактировать панель, не влияя на ее состояние в других контекстах. Например, вы можете изменить размер панели Свойства и закрепить ее в другом месте главного окна при настройке пл"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Группировка панелей", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Группировка панелей Группировка панелей&nbsp; Панели можно группировать друг с другом, если они состыкованы в одной области. 1. Наведите указатель мыши на строку заголовка или заголовок вкладки панели, которую вы хотите сгруппировать. 2. Перетащите панель в ту же область другой панели, которая указа"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Скрытие панелей", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Скрытие панелей Скрытие панелей&nbsp; Закрепленная панель имеет канцелярскую кнопку, позволяющую скрыть панель, если фокус находится в другом месте рабочей области. Это позволяет освободить место на экране в главном окне. 1. Просмотрите панель. 2. В строке заголовка панели сделайте одно из следующих"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Восстановление окон", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Восстановление окон Восстановление окон Команда Восстановить окна позволяет сбросить расположение панелей в главном окне. По умолчанию параметр Включить глобальное восстановление активен, поэтому восстановление повлияет на расположение панелей во всех контекстах. В противном случае восстановление по"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Просмотр панелей", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Просмотр панелей Просмотр панелей&nbsp; Панель можно просматривать в зависимости от ее группового назначения, видимости и общего контекста сцены. Например, некоторые панели появляются автоматически на основе активной вкладки на ленте или выбранного элемента/команды в рабочей области. 1. Укажите на п"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Добавление команд в ПБД", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Добавление команд в ПБД Добавление команд в ПБД Вы можете добавлять команды на ленте в ПБД (Панель Быстрого Доступа). 1. На Ленте, найдите команду или группу, которую хотите добавить в ПБД. 2. Щелкните команду или группу правой кнопкой мыши и выберите Добавить на панель быстрого доступа ."}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Настройка ПБД", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Настройка ПБД Настройка ПБД Вы можете контролировать наличие стандартных команд на ПБД и его расположение в рабочей области. 1. В левом верхнем углу главного окна нажмите на стрелку Настроить панель быстрого доступа. 2. Выполните одно или все из следующих действий: &#183; Чтобы сделать команду досту"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Удаление команд из ПБД", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Удаление команд из ПБД Удаление команд из ПБД Вы можете удалить команды из ПБД, которые вы добавили из Ленты. 1. На ПБД, укажите команду или группу, которую вы хотите удалить. Если команда принадлежит к группе на ПБД, вам нужно будет удалить всю группу. 2. Щелкните команду или группу правой кнопкой "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "РАБОЧА СРЕДА", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "РАБОЧА СРЕДА Рабочая среда&nbsp; СОДЕРЖАНИЕ ОПРЕДЕЛЕНИЕ ЕДИНИЦ И ВЕЛИЧИН РЕДАКТИРОВАНИЕ НАСТРОЕК БЫСТРЫЙ ДОСТУП КЛОНИРОВАНИЕ ВЫБРАННЫХ ОБЪЕКТОВ КОПИРОВАНИЕ И ВСТАВКА ВЫДЕЛЕННОГО УДАЛЕНИЕ ВЫДЕЛЕННОГО ПАНЕЛИ РЕДАКТИРОВАНИЕ ПАНЕЛЕЙ ПО КОНТЕКСТУ СТЫКОВКА ПАНЕЛИ ГРУППИРОВКА ПАНЕЛЕЙ СКРЫТИЕ ПАНЕЛЕЙ ВОССТА"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Вкладка Помощь", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Вкладка Помощь Вкладка Помощь На вкладке Помощь отображаются команды для доступа к документации по продукту, техподдержке. Помощь и справка Название Описание Помощь Открывает файл справки Рациональное Производство. Python API Открывает справочное руководство Python API. Python 2.7 Открывает официаль"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Дерево Построения", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Дерево Построения Дерево Построения Панель Дерево Построения предоставляет схему текущей планировки в 3D-мире и параметры для выбора и редактирования перечисленных элементов. 1. Показать/скрыть невидимые компоненты в 3D-мире 2. Поиск компонентов 3. Категория компонента 4. Выбранный компонент 5. Назв"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Детектор столкновений", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Детектор столкновений Детектор Столкновений 1. Создать новый детектор столкновений. 2. Детектор столкновений Выделенное против мирового. Сравнивает выбранную геометрию с геометрией в трехмерном мире. 3. Добавлены детекторы столкновений. Эти детекторы проверяют столкновения между геометриями A и B. 4"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Диаграмма компонента", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Диаграмма компонента Диаграмма Компонента Панель Диаграмма компонента предоставляет схему выбранного компонента в трехмерном мире, включая узлы компонентов, поведение, свойства и элементы. 1. Поле поиска для дерева узлов компонента 2. Развернуть параметры для дерева узлов компонента 3. Корневой узел"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Каталог", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Каталог Каталог Панель электронного каталога позволяет управлять подключенными источниками файлов и загружать эти файлы в трехмерный мир. 1. Системная коллекция для всех связанных файлов 2. Системный источник общедоступных моделей 3. Системный источник для моих моделей 4. Системная коллекция недавно"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Взаимодействие", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Взаимодействие Взаимодействие Панель Взаимодействие используется с командой Взаимодействие , чтобы вы могли манипулировать, настраивать и программировать робота в трехмерном мире. 1. Наименование робота 2. Значения положения TCP (X,Y,Z) 3. Ориентация TCP (Rx, Ry, Rz) 4. Выбор Базы, Инструмента, Оси "}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Вывод", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Вывод Вывод Панель Вывод печатает отзывы о событиях, командах и других действиях. Подсказка: &#183; Панель вывода может автоматически очищаться при запуске симуляции. Эта опция находится в Файл-Настройки-Общие. &nbsp;"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактор Процессов", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактор Процессов Редактор Процессов Панель Редактор Процессов позволяет добавлять и редактировать процедуры процессов. 1. Имя компонента и поведение исполнителя процесса 2. Название процедуры процесса 3. Раздел требований 4. Раздел определения процесса 5. Выбранный оператор 6. Галерея операторов 7"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактор Технологического процесса", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактор Технологического процесса Редактор Технологического Процесса Панель Редактор Технологического Процесса позволяет добавлять и редактировать последовательности процессов, связанные с группами процессов. Группа процессов имеет транспортный маршрут между шагами процесса, который визуализируется"}, {"category": "R-PRO CAD CORE MANUAL", "tab": "Р-Про CAD RU", "title": "Редактор Типа Детали", "url": "", "badge": "RU", "badge_type": "ru", "doc_type": "html", "snippet": "Редактор Типа Детали Редактор Типа Детали Панель Редактор Типа Детали показывает Типы деталей и Сборки, созданные для планировки. Панель позволяет добавлять и редактировать их, а также объединять их в группы процессов. Вы также можете определить свойства для типов деталей и сборок. 1. Развернуть/све"}, {"category": "R-PRO C  cases, you would use commands on the Ribbon to create a component and new g"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Navigation", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Navigation Navigation A short guide on how to navigate the 3D and drawing worlds. Contents&nbsp; Show Hide Camera View Selector 3D Mouse Camera The camera of the 3D and drawing worlds can be interacted with by using a mouse. Rotation Right mouse button (RMB) will rotate the camera but only in the 3D"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Running a simulation", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Running a simulation Running a Simulation The controls for running a simulation are positioned at the top-middle section of the 3D world. These controls allow you to customize the simulation time, speed, and runtime. When you run a simulation, components in a layout may perform one or more tasks. Fo"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Selection", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Selection Selection You can select objects in the 3D and drawing worlds by using a mouse and other tools. Contents&#160; Show Hide Direct Selection Select Commands Panels Direct Selection Left mouse button (LMB) will directly select an object based on the context of a scene. Press and hold CTRL to a"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Teaching a robot", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Teaching a robot Teaching a Robot If you want to teach a robot in the 3D world, click the Program tab to access the Robot view. If you want to interact with a robot and teach positions: On the Ribbon , go to the Manipulation group, and then click the Jog command. This allows you to select a robot co"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Visualization", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Visualization Visualization The 3D world toolbar allows you to affect the visuals of the viewport. 1. Fill View 2. Headlight 3. Camera Projection 4. Rendering 5. Frame Visibility 6. View Editor &nbsp; Contents&nbsp; Show Hide Fill View Headlight Camera Projection Rendering Frame Visibility View Edit"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Troubleshoot the eCatalog panel", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Troubleshoot the eCatalog panel Troubleshoot the eCatalog panel In some cases, you might need to troubleshoot the eCatalog panel. Contents&nbsp; Show Hide Traffic Refresh Log Traffic The eCatalog panel acts like a web browser and uses HTTP (port 443). Your network and firewall(s) must allow traffic "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding a collection group", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding a collection group Adding a Collection Group You can add a collection group in the eCatalog panel. In the eCatalog panel , access the Collections view. Click the PLUS SIGN , and then click Add Collection Group ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Add collections and sources to groups", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Add collections and sources to groups Adding Collections and Sources to Groups Collections and sources can be grouped with one another in a collection group. In the eCatalog panel , access the Collections view. Find the collections and/or sources you want to group, and then drag them into a collecti"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Deleting a collection group", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Deleting a collection g
