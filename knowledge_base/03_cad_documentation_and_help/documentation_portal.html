а в 3D-мире, тогда как команду Показать раздела Структура можно "}, {"category": "R-Pro CAD Core Manual", "title": "Выбор свойств в компоненте", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_modeling_selecting_properties_in_a_component.html", "lang": "RU", "prod": "R-Pro", "snippet": "Выбор свойств в компоненте Выбор свойств в компоненте &nbsp; Вам нужно использовать панель Диаграмма компонента для выбора свойств в компоненте. Когда свойство выбрано, его свойства будут отображаться на панели задач Свойства. В противном случае любые видимые свойства компонента могут быть прочитаны"}, {"category": "R-Pro CAD Core Manual", "title": "Упрощение геометрии", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_modeling_simplifying_geometry.html", "lang": "RU", "prod": "R-Pro", "snippet": "Упрощение геометрии Упрощение геометрии &nbsp; Геометрию объекта можно упростить, чтобы уменьшить количество данных и визуализировать его максимальный объем. 1. Выберите одну или несколько элементов в компоненте. 2. На вкладке Моделирование в группе Геометрия , щелкните стрелку Инструменты, а потом "}, {"category": "R-Pro CAD Core Manual", "title": "Срезать геометрию", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_modeling_slicing_geometry.html", "lang": "RU", "prod": "R-Pro", "snippet": "Срезать геометрию Срезать геометрию Геометрию элемента можно разрезать и разделить на новые элементы геометрии. 1. Выберите одну или несколько элементов в компоненте. 2. На вкладке Моделирование в группе Геометрия , щелкните стрелку Инструменты , а потом под Инструменты элементов , нажмите Срез . 3."}, {"category": "R-Pro CAD Core Manual", "title": "Разделить элемент", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_modeling_splitting_features.html", "lang": "RU", "prod": "R-Pro", "snippet": "Разделить элемент Разделить элемент Разделение позволяет перегруппировать геометрию объектов в новые объекты. Геометрия должна содержаться в элементе геометрии, чтобы ее можно было разделить, иначе вам придется сначала свернуть объект, прежде чем разбивать его геометрию. 1. Выберите корневой узел ко"}, {"category": "R-Pro CAD Core Manual", "title": "Перенос компонентов в другие компоненты", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_modeling_transferring_components_to_other_components.html", "lang": "RU", "prod": "R-Pro", "snippet": "Перенос компонентов в другие компоненты Перенос компонентов в другие компоненты &nbsp; Поведения, которые поддерживают материальный поток, могут быть подключены для передачи компонентов от одного компонента к другому с помощью поведения типа интерфейса. 1. В трехмерном мире выберите компонент. 2. На"}, {"category": "R-Pro CAD Core Manual", "title": "Перенос компонентов в другие поведения", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_modeling_transferring_component_to_other_behaviors.html", "lang": "RU", "prod": "R-Pro", "snippet": "Перенос компонентов в другие поведения Перенос компонентов в другие поведения &nbsp; Поведения, поддерживающие поток материалов, можно подключить к компонентам для передачи внутри компонента путем редактирования свойств коннекторов. 1. В трехмерном мире выберите компонент. 2. Нажмите на вкладку Моде"}, {"category": "R-Pro CAD Core Manual", "title": "Использование внешнего редактора Python", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_modeling_using_external_python_editor.html", "lang": "RU", "prod": "R-Pro", "snippet": "Использование внешнего редактора Python Использование внешнего редактора Python &nbsp; Чтобы использовать внешний редактор Python, перейдите в настройки: ФАЙЛ - Настройки- Общие - Конфигурация. В опции Редактор скриптов Python , выберите Внешний редактор . В параметре Системные установки по умолчани"}, {"category": "R-Pro CAD Core Manual", "title": "Кабели в мире физики", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_physics_cables_in_physics_world.html", "lang": "RU", "prod": "R-Pro", "snippet": "Кабели в мире физики Кабели в мире физики&nbsp; Рациональное Производство поддерживает использование ремней, проводов и других типов объектов, реализованных как поведение физического кабеля. Геометрия Каждый кабель генерируется с собственным набором геометрии. Геометрия кабеля состоит из капсул, кот"}, {"category": "R-Pro CAD Core Manual", "title": "Столкновения в мире физики", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_physics_colliders.html", "lang": "RU", "prod": "R-Pro", "snippet": "Столкновения в мире физики Столкновения в мире физики&nbsp; ГеометрияСтолкновения - это объект, который может реагировать на физические объекты во время симуляции. Каждая ГеометрияСтолкновения представляет собой оболочку, охватывающую геометрию элемента в компоненте. Каждый элемент, включая корневой"}, {"category": "R-Pro CAD Core Manual", "title": "Группы Столкновений в мире физики", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_physics_collisions.html", "lang": "RU", "prod": "R-Pro", "snippet": "Группы Столкновений в мире физики Группы Столкновений в мире физики &nbsp; Столкновение может произойти между любым физическим объектом, имеющим свойство ГеометрияСтолкновения, и поведением объекта Physics Entity. Свойства поведения физического объекта можно использовать для включения/исключения узл"}, {"category": "R-Pro CAD Core Manual", "title": "Суставы в мире физики", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_physics_joints_in_physics_world.html", "lang": "RU", "prod": "R-Pro", "snippet": "Суставы в мире физики Суставы в мире физики &nbsp; Рациональное Производство поддерживает использование соединений D6, которые реализованы как поведение Physics Joint. Эти типы соединений могут иметь пользовательские определения и поддерживать несколько степеней свободы. 1. В трехмерном мире выберит"}, {"category": "R-Pro CAD Core Manual", "title": "Пути в физическом мире", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_physics_paths_in_physics_world.html", "lang": "RU", "prod": "R-Pro", "snippet": "Пути в физическом мире Пути в физическом мире&nbsp; Движение и поток компонентов с физическими свойствами можно реализовать с помощью поведения Physics Path. Это позволяет применять контактные силы к компонентам, движущимся по траекториям. Например, вы можете выталкивать, отклонять, делить, сбрасыва"}, {"category": "R-Pro CAD Core Manual", "title": "ФИЗИКА", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_physics_physics.html", "lang": "RU", "prod": "R-Pro", "snippet": "ФИЗИКА Физика СОДЕРЖАНИЕ МИР ФИЗИКИ КАБЕЛИ В МИРЕ ФИЗИКИ ГРУППЫ СТОЛКНОВЕНИЙ В МИРЕ ФИЗИКИ СТОЛКНОВЕНИЯ В МИРЕ ФИЗИКИ СУСТАВЫ В МИРЕ ФИЗИКИ ПУТИ В ФИЗИЧЕСКОМ МИРЕ"}, {"category": "R-Pro CAD Core Manual", "title": "Мир физики", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_physics_physics_world.html", "lang": "RU", "prod": "R-Pro", "snippet": "Мир физики Мир физики&nbsp; В Рациональном Производстве в трехмерной среде существует мир симуляции и мир физики. Такое сосуществование позволяет компонентам действовать независимо от физических сил. Кроме того, компоненты могут перемещаться в мир симуляции и из него в мир физики. Обычно это происхо"}, {"category": "R-Pro CAD Core Manual", "title": "Моделирование процессов", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_process_modeling_process_modeling.html", "lang": "RU", "prod": "R-Pro", "snippet": "Моделирование процессов Моделирование процессов Моделирование процессов позволяет вам управлять деталями, процессами и потоками процессов на планировке. Эта функция оптимизирует процесс создания планировки с помощью визуализированного рабочего процесса, быстрой настройки симуляции и улучшенной произ"}, {"category": "R-Pro CAD Core Manual", "title": "Терминология", "url": "rpro_help_decompiled/Help_RP_ru/russian_tasks_process_modeling_terminology.html", "lang": "RU", "prod": "R-Pro", "snippet": "Терминология Терминология Обратите внимание на следующие термины и их контекст: &#183; Редактор процессов. Графический интерфейс пользователя для исполнителя s", "snippet": "Measuring components Measuring Components Measurements can be taken to evaluate the distance and/or angle between two points in the 3D world. The approximated value of a measurement is controlled by a Display accuracy setting that affects how many digits are displayed to the right of a decimal point"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Moving and rotating components", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Components/Moving_and_rotating_components.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Moving and rotating components Moving and Rotating Components The location of a component in the 3D world is defined by coordinate values (XYZ) and degrees of rotation (RxRyRz) in a coordinate system. There are three available coordinate systems in the 3D world: World is a global coordinate system w"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Plugging in components", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Components/Plugging_in_components.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Plugging in components Plugging in Components The PnP command allows you to plug components into one another at physical interfaces. When you select a component: Available physical interfaces are marked by arrows highlighted yellow and located at Frame features in the component. Connected physical i"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Reporting statistics", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Components/Reporting_statisticsv2.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Reporting statistics Reporting Statistics The Statistics dashboard allows you to report statistics collected from components during a simulation. Contents&#160; Show Hide Open the Dashboard Choose a Layout Choose a Chart Edit Chart Properties Plot Data View Data Print Charts Export Data Open the Das"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Selecting components", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Components/Selecting_components.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Selecting components Selecting Components A selection in the 3D world is highlighted by Silhouette and Fill colors. In the 3D world, you can: Click any component to select it. Hold down CTRL and click components to add or remove them from a selection. Click an empty space in the 3D world to clear a "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Selecting components in an area", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Components/Selecting_components_in_an_area.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Selecting components in an area Selecting Components in an Area The Select command allows you to make area selections in the 3D world and disable other modes that may move or otherwise alter components. When using area selection, components must occupy a significant amount of space in the drawn regi"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Snapping components", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Components/Snapping_components.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Snapping components Snapping Components &#160;A selected component can be snapped to a location relative to other components in the 3D world. In the 3D world, select the components you want to relocate. On the Home tab, in the Tools group, click Snap . In the Component Snap task pane, under the Mode"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Accessing Connectivity feature", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Accessing_Connectivity_feature.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Accessing Connectivity feature Accessing Connectivity Feature The Connectivity feature and its commands can be accessed from a Connectivity tab that appears above the Ribbon. If the Connectivi ng to WinMOD Connecting to WinMOD The WinMOD Net connection plugin implements the connection to the WinMOD simulation system using its own proprietary communication library called WinMOD Net. The WinMOD Net protocol is TCP/IP based and thus works both locally and over a network. Note: The co"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Connectivity", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Connectivity.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Connectivity Connectivity The Connectivity add-on allows you to connect a programmable logic controller (PLC) or server to R-Pro 2.1 and transport data over that connection. As a result, you can read and write the variables of components in a 3D world simulation over a network. Contents Terminology "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Enabling Connectivity feature", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Enabling_Connectivity_feature.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Enabling Connectivity feature Enabling Connectivity Feature The Connectivity feature can be turned on/off using a backstage option. Click the File tab, and then on the Navigation pane, click Options . Click Add On , and then in Connectivity , do one of the following: To enable the feature, click Ena"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Connecting to a Fanuc robot controller", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Fanuc_robot_plugin.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Connecting to a Fanuc robot controller Connecting to a Fanuc robot controller 1. About the plugin The Fanuc Robot plugin allows you to connect to a Fanuc robot controller during simulation and exchange data. For example, a program running in a virtual or physical Fanuc controller can drive the joint"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Locking values", "url": "rpro_h unning a PLC"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Universal Robots RTDE Plugin", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Universal_Robots_RTDE_Plugin.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Universal Robots RTDE Plugin Universal Robots RTDE Plugin The Universal Robots RTDE plugin allows you to connect Universal Robot CB3 series robot controllers with an RTDE interface. You can also connect a URSim robot controller simulator with an RTDE interface. For example, you can can establish a c"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Using the Siemens S7 plugin", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Using_the_Siemens_S7_plugin.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Using the Siemens S7 plugin Connecting to a Siemens S7-series PLC The Siemens S7 plugin allows you to connect to Siemens S7-series PLCs using a S7 communication (S7comm) protocol. More specifically, it uses the “PUT” and “GET” functionality of the S7comm protocol. It is based on TCP/IP and works ove"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Backward Compatibility", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Staubli/Backward_Compatibility.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Backward Compatibility Backward Compatibility If you are upgrading layouts made with an older version of the Stдubli add-on, refer to the following information about backward compatibility. Issue Explanation The new add-on uses the same configuration persistence format as the old add-on. This means "}, {"category": "R-Pro / VC CAD Core Manual", "title": "CS8 Connections", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Connectivity/Staubli/CS8_Connections.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "CS8 Connections CS8/CS9 Connections If you are using the Stдubli add-on with a real or emulated Stдubli CS8/CS9 ", "title": "Printing a drawing", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Drawings/Printing_a_drawing.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Printing a drawing Printing a Drawing A drawing can be exported to produce a print-ready document. Generally, a template is used to print one or more drawings as a sheet. If do not want to use a template for printing, select the drawings you want to print in the drawing world. On the Drawing tab, in"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Closing a layout", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Layouts/Closing_a_layout.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Closing a layout Closing a Layout A layout is always open in the 3D world. That means closing one layout in the 3D world opens a new empty layout in the 3D world. Click the File tab, and then on the Navigation pane, click New . In the prompt, do one of the following: Click Don't Save to not save and"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Creating a 3D dimension", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Layouts/Creating_a_3D_dimension.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Creating a 3D dimension Creating a 3D dimension A dimension allows you to visualize distances and angles between lines, points and edges in the simulation world. On the HOME tab, in the Dimension group, do one of the following: In the simulation world, select two points that define the dimension, an"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Exporting geometry of layouts", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Layouts/Exporting_geometry_of_layouts.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Exporting geometry of layouts Exporting Geometry of Layouts The geometry of an entire layout can be exported as a supported file type. On the Home tab, in the Export group, click Geometry . In the Export Layout task pane, under Components to export , click All . In the File Format list, click a supp"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Opening a layout", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Layouts/Opening_a_layout.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Opening a layout Opening a Layout A layout is a rpro file that allows you to save your work in the 3D and drawing worlds. Layouts are always opened in the 3D world and contain references to components, layout items and settings for a scene. A layout is an archive file, so when you open a layout its "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Opening a new layout", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Layouts/Opening_a_new_layout.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Opening a new layout Opening a New Layout When you start R-Pro 2.1 a new empty layout is opened automatically in the 3D world. If you want to clear and remove everything in the 3D world layout: Click the File tab, and then on the Navigation pane, click Clear All . Tip: You can press CTRL+N to clear "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Saving a layout", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Layouts/Saving_a_layout.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Saving a layout Saving a Layout A layout allows you to save the location, connections and property values of components in the 3D world. A layout also stores your view of a scene and any layout items in the 3D world and drawing area. In the 3D world, adjust the view to define the preview image of th"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Add and edit base frames", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Add_and_edit_base_frames.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Add and edit base frames Add and Edit Base Frames A base frame is a coordinate system used by a robot and other types of components to simplify locations in an area. That is, you can use a base frame as a local coordinate system for defining the position and orientation of objects. In the 3D world, "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Add and edit tool frames", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Add_and_edit_tool_frames.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Add and edit tool frames Add and Edit Tool Frames A tool frame is a point of reference used by robots and other types of components for positioning objects. Generally, a tool frame is used with a manipulator to jog a robot and teach positions in relation to a base coordinate system (active base fram"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Assigning a joint to a controller", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Assigning_a_joint_to_a_controller.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Assigning a joint to a controller Assigning a Joint to a Controller The joint of a node can be assigned to a Robot or Servo Controller behavior, thereby the motion of that joint can be driven by a controller. In the 3D world, select a component. Click the Modeling tab, and then in the Component Grap"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Collapsing features", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Collapsing_features.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Collapsing features Collapsing Features Collapsing allows you to merge a selected feature and its child features into a single Geometry feature. This, of course, would remove the hierarchy of the collapsed features. Select a feature. You can select multiple features, but this will not merge the sele"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Creating a new behavior", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Creating_a_new_behavior.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Creating a new behavior Creating a New Behavior A behavior is an action or set of actions that a component can perform before or during a simulation. Either create or select a component in the 3D world. Click the Modeling tab, and then in the Component Graph panel, Component Node Tree , select a nod"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Creating a new component", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Creating_a_new_component.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Creating a new component Creating a New Component A new component can be created at the 3D world origin. In most cases, you should add at least one feature to a component after its creation. On the Modeling tab, in the Component group, click New . (Optional) In the Geometry group, click the Features"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Creating a new feature", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Creating_a_new_feature.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Creating a new feature Creating a New Feature Geometry in a component is formed into sets which are grouped in features. Not all features contain geometry or act as primitive shapes. Some features perform operations on other features, while other types of features generate data related to the 3D wor"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Creating a new node", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Creating_a_new_node.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Creating a new node Creating a New Node A link is a node added to a component's structure and is mainly used to define joints and other mechanisms of movement in a component. Either create or select a component in the 3D world. Click the Modeling tab, and then in the Component Graph panel, Component"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Creating a new property", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Creating_a_new_property.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Creating a new property Creating a New Property A property is a variable of a component that can be referenced by other objects in that component. Properties of this scope are contained in the root node of a component. Either create or select a component in the 3D world. On the Modeling tab, in the "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Decimating geometry", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Decimating_geometry.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Decimating geometry Decimating Geometry Decimation allows you to simplify the tessellation of geometry in features by merging edges and eliminating redundant vertices. The operation will try to merge all points within a max error tolerance to reach a desired quality, and then print the results in th"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Defining a joint offset", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Defining_a_joint_offset.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Defining a joint offset Defining a Joint Offset The Move command, other tools and properties can be used to define the Offset property of a selected node and its joint. In the 3D world, select a component. Click the Modeling tab, and then in the Component Graph panel, Component Node Tree , select a "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Editing node feature tree", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Editing_node_feature_tree.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Editing node feature tree Editing Node Feature Tree The feature tree of a selected node can be edited using a mouse and quick commands. Contents&#160; Show Hide Moving Exploding Grouping Removing Moving You can drag and drop features to different depths and levels in the same or other node feature t"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Extracting geometry into new component", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Extracting_geometry_into_a_new_component.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Extracting geometry into new component Extracting Geometry into New Component Extraction allows you to regroup selected features/links into new components. Generally, extraction is used when parts and assemblies in an imported CAD file were not formed into separate components. Select one or more fea"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Extracting geometry into new node", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Extracting_geometry_into_new_node.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Extracting geometry into new node Extracting Geometry into New Node Extraction allows you to regroup selected features into new nodes. Generally, the extraction of features to new links is used to speed up the modeling process of an imported CAD file as a component with movable parts. That is, the t"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Importing mathematical data", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Importing_mathematical_data.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Importing mathematical data Importing Mathematical Data You can import the mathematical data of a supported CAD file, for example boundary representations (BREP) and curves. Note: This task was made using this CAD file . Either from the Home tab or Modeling tab, in the Import group, click Geometry ."}, {"category": "R-Pro / VC CAD Core Manual", "title": "Interacting with a joint", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Interacting_with_a_joint.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Interacting with a joint Interacting with a Joint In previous product versions, you needed to use a Jog Info behavior to make the joint of a node interactive. Now, the joint properties of a node are used to automatically make a joint interactive if a Jog Info behavior is not available for that joint"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Inverting geometry", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Inverting_geometry.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Inverting geometry Inverting Geometry The geometry of a feature can be inverted to face opposite its normal direction. Geometry must be contained in a Geometry feature in order to be inverted, otherwise you would first need to collapse a feature before inverting its geometry. Select the root node of"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Making component unique or shared", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Making_component_unique_or_shared.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Making component unique or shared Making Component Unique or Shared Components in the 3D world with the same VCID can share identical feature trees. This is indicated by a feature selection and has an added benefit in terms of memory. Identical means the components are exact copies of one another. G"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Merging faces", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Merging_faces.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Merging faces Merging Faces Points in faces can be merged together to form smoother surfaces. On the Modeling tab, in the Geometry group, click the Tools arrow, and then click Merge faces . In the 3D world, select a geometry set. In the Merge faces task pane, set Tolerance to the desired radius for "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Merging features", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Merging_features.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Merging features Merging Features Merging allows you move geometry in different Geometry features into a single Geometry feature. Select the Geometry features you want to merge together in a component. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Feature Tools , "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Saving a component", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Saving_a_component.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Saving a component Saving a Component A component can be saved in order to be loaded and used in any layout opened in the 3D world. Select the component you want to save in the 3D world. On the Modeling tab, in the Component group, do one of the following: To save a component to its existing file, c"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Searching component data", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Searching_component_data.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Searching component data Searching Component Data At the top of each pane in the Component Graph panel are tools for searching and filtering data in a selected component. In the 3D world, select a component. Click the Modeling tab, and then in the Component Graph panel, do one of the following: To c"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Selecting behaviors in a component", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Selecting_behaviors_in_a_component.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Selecting behaviors in a component Selecting Behaviors in a Component You need to use the Component Graph panel to select behaviors in a component. In the 3D world, select a component or one of its features. If you did not select a feature, click the Modeling tab, and then in the Component Graph pan"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Selecting features in a component", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Selecting_features_in_a_component.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Selecting features in a component Selecting Features in a Component The context of a scene when modeling a component allows you to directly select the features of any component in the 3D world. In some cases, you cannot directly select a feature if it does not occupy any space and visually represent"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Selecting nodes in a component", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Selecting_nodes_in_a_component.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Selecting nodes in a component Selecting Nodes in a Component You can use the Component Graph panel to select nodes in a component. It is helpful to use the Move command for showing the offset and joint axis of a selected node in the 3D world, whereas the Structure Show command can be used to show t"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Selecting properties in a component", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Selecting_properties_in_a_component.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Selecting properties in a component Selecting Properties in a Component You need to use the Component Graph panel to select properties in a component. When a property is selected, its properties will be displayed in a Property task pane. Otherwise, any visible properties of a component can be read a"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Simplifying geometry", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Simplifying_geometry.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Simplifying geometry Simplifying Geometry The geometry of a feature can be simplified to reduce its data count and visualize its maximum volume. Select one or more features in a component. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Simplify , do one of the foll"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Slicing geometry", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Slicing_geometry.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Slicing geometry Slicing Geometry The geometry of a feature can be cut and split into new Geometry features. Select one of more features in a component. On the Modeling tab, in the Geometry group, click the Tools arrow, and then under Feature Tools , click Slice . In the Slice task pane, define a Sn"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Splitting features", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Splitting_features.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Splitting features Splitting Features Splitting allows you to regroup geometry in features into new features. Geometry must be contained in a Geometry feature in order to be split, otherwise you would first need to collapse a feature before splitting its geometry. Select the root node of a component"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Transferring components to other components", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Transferring_components_to_other_components.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Transferring components to other components Transferring Components to Other Components Behaviors that support material flow can be connected to transfer components from one component to another component by using interface type behaviors. In the 3D world, select a component. Click the Modeling tab,"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Transferring components to other behaviors", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Transferring_component_to_other_behaviors.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Transferring components to other behaviors Transferring Components to Other Behaviors Behaviors that support material flow can be connected to transfer components within a component by editing the properties of connectors. In the 3D world, select a component. Click the Modeling tab, and then in the "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Using external Python editor", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Using_external_Python_editor.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Using external Python editor Using External Python Editor To use an external Python editor, go to the following backstage location: FILE - Options - General – Configuration. From the Python script editor option, select the External editor . From the System Default , change which editor program shoul"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Adding a Decal", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Materials/Adding_a_Decal.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Adding a Decal Adding a Decal A decal can be added to a component by using geometry to preform a shape with texture coordinates. The added shape is contained in a new Geometry feature, which you should assign a material. In most cases, the material of a decal has a texture file, for example an image"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Adding Material to User Library", "url": "rpro_help_decompiled/Help_RP/English/Tasks/Modeling/Materials/Adding_Material_to_User_Library.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Adding Material to User Library Adding Material to User Library You can add a material to a user library. The material must be available in the current layout of the 3D world and not already stored in user and system libraries. The m roperties Name Description Name Defines the name of the interface. IsAbstract Defines the type of connection supported by the interface. A True value supports only "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Articulated Kinematics", "url": "rpro_help_decompiled/Help_RP/Reference/Behaviors/Kinematics/Articulated_Kinematics.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Articulated Kinematics Articulated Kinematics An Articulated Kinematics behavior is a list of kinematic properties used by a Robot Controller for solving an articulated robot's motions which relate to joint length, angle, positioning, coupling, configuration and tolerance levels. Properties Name Des"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Cartesian Kinematics", "url": "rpro_help_decompiled/Help_RP/Reference/Behaviors/Kinematics/Cartesian_Kinematics.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Cartesian Kinematics Cartesian Kinematics A Cartesian Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for a Cartesian type robot (gantry, portal, etc.) in which the robot has three transitional joints and an articulated wrist (three rotational joints) defined "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Delta Kinematics", "url": "rpro_help_decompiled/Help_RP/Reference/Behaviors/Kinematics/Delta_Kinematics.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Delta Kinematics Delta Kinematics A Delta Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for delta type, parallel robots. Properties Name Description Name Defines the name of the kinematics. LinkLength1 Defines the length of the robot's driving arm from its s"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Parallelogram Kinematics", "url": "rpro_help_decompiled/Help_RP/Reference/Behaviors/Kinematics/Parallelogram_Kinematics.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Parallelogram Kinematics Parallelogram Kinematics A Parallelogram Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller used for palletizing operations in which the wrist orientation is always pointing downward. Properties If you want to use Parallelogram Kinematics"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Python Kinematics", "url": "rpro_help_decompiled/Help_RP/Reference/Behaviors/Kinematics/Python_Kinematics.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Python Kinematics Python Kinematics A Python Kinematics behavior allows you to define the forward and/or inverse kinematics of a Robot Controller for a robot using a script written in Python programming language. Properties Name Description Name Defines the name of the kinematics. Script Defines the"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Scara Kinematics", "url": "rpro_help_decompiled/Help_RP/Reference/Behaviors/Kinematics/Scara_Kinematics.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Scara Kinematics Scara Kinematics A Scara Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for a SCARA type robot in which the wrist is defined in one axis (generally the Z-axis) and has two possible configurations (Left and Right). Properties Name Description "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Scara Kinematics (old)", "url": "rpro_help_decompiled/Help_RP/Reference/Behaviors/Kinematics/Scara_Kinematics_old.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Scara Kinematics (old) Scara Kinematics (old) A Scara Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for a SCARA type robot in which the wrist is defined in one axis (generally the Z-axis) and has two possible configurations (Left and Right). Note : This is d"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Capacity Controller", re is a two-dimensional flat surface. Generally, a Plane is used for visualization purposes or to aid in the selection and interactive picking of geometry in the 3D world. Properties Name Description Name Defines the name of the plane. Visible Turns on/off the visibility of "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Python Feature", "url": "rpro_help_decompiled/Help_RP/Reference/Features/Python_Feature.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Python Feature Python Feature A Python Feature generates geometry and transforms child features using a script written in Python. Properties Name Description Name Defines the name of the feature. Script Defines the feature's Python script. When the feature is initially created, the script is initial"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Revolve", "url": "rpro_help_decompiled/Help_RP/Reference/Features/Revolve.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Revolve Revolve A Revolve feature sweeps the geometry of child features along a path, thereby constructing new geometry. Generally, a Revolve operation is used to sweep geometry, which sometimes requires the use of Transform and Extrude features. Properties Name Description Name Defines the name of "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Sphere", "url": "rpro_help_decompiled/Help_RP/Reference/Features/Sphere.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Sphere Sphere A Sphere feature is a spherical shape. Spheres can be molded into different shapes, for example capsules and balls, and used as indicators in the 3D world. Properties Name Description Name Defines the name of the sphere. Visible Turns on/off the visibility of sphere. Material Defines t"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Switch", "url": "rpro_help_decompiled/Help_RP/Reference/Features/Switch.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Switch Switch A Switch feature selects one of its child features and disables the other child features. Switch operations are helpful if you need to switch out geometry or other operations based on component properties. Properties Name Description Name Defines the name of the switch. Choice Defines "}, {"category": "R-Pro / VC CAD Core Manual", "title": "Text", "url": "rpro_help_decompiled/Help_RP/Reference/Features/Text.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Text Text A Text feature is a container of text that is visualized in the 3D world. Text features are helpful at labeling processes and stages in a layout as well as the flow of components. Properties Name Description Name Defines the name of the feature. Visible Turns on/off the visibility of text."}, {"category": "R-Pro / VC CAD Core Manual", "title": "Transform", "url": "rpro_help_decompiled/Help_RP/Reference/Features/Transform.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Transform Transform A Transform feature allows you to write expressions for transforming child features. Transform operations use a dot (.) character to separate nested expressions, and you should refer to Operator Precedence to know the parsing order for the transformation. Properties Name Descript"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Wedge Feature", "url": "rpro_help_decompiled/Help_RP/Reference/Features/Wedge.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Wedge Wedge Feature A Wedge feature is a wedge-like shape. Wedges can be molded into different shapes that can be varying lengths and heights as well as mirrored along different axes. Properties Name Description Name Defines the name of the wedge. Visible Turns on/off the visibility of wedge. Materi"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Append To List", "url": "rpro_help_decompiled/Help_RP/Reference/Process_Statements/Append_To_List.htm", "lang": "EN", "prod": "R-Pro / Visual Components", " tements. The statement continues execution until the break c"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Change Type", "url": "rpro_help_decompiled/Help_RP/Reference/Process_Statements/Change_Type.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Change Type Change Type A ChangeType statement allows you to change a product instance to be of another product type both logically and visually. Currently, ChangeType does not support Assemblies. &#160; &#160; Properties Name Description ProductVariableName Variable where to get the product instanc"}, {"category": "R-Pro / VC CAD Core Manual", "title": "CheckAssembly", "url": "rpro_help_decompiled/Help_RP/Reference/Process_Statements/CheckAssembly.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "CheckAssembly CheckAssembly Checks if current state of an Assembly Instance matches a given Assembly Order and saves the result into a Process variable. The result variable is set to True when all Pattern Slots selected in the Assembly Order are filled with products, and False otherwise. Figure 1. E"}, {"category": "R-Pro / VC CAD Core Manual", "title": "Comment", "url": "rpro_help_decompiled/Help_RP/Reference/Process_Statements/Comment.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Comment Comment A Comment statement is a non-executable statement that is used to leave comments about the program. Properties Name Description Comment Defines the text of the comment."}, {"category": "R-Pro / VC CAD Core Manual", "title": "Construct", "url": "rpro_help_decompiled/Help_RP/Reference/Process_Statements/Construct.htm", "lang": "EN", "prod": "R-Pro / Visual Components", "snippet": "Construct Construct Creates an empty Assembly Instance and then fills it with the given products. The given Assembly Order defines both the Assembly Product Type to create, and to which Pattern Slots the Product Instances are placed into. The products are placed into Pattern Slots in the cor rgonomics_v0.1.html", "lang": "RU", "prod": "WorksErgo", "snippet": "Help - Ergonomics /* ========================= Base ========================= */ body { margin: 0; font-family: Arial, Helvetica, sans-serif; } /* ========================= Glass Header (Desktop + Mobile) ========================= */ .app-header { position: sticky; top: 0; z-index: 1000; display: fl"}];
let currentCat = "all";

const searchInput = document.getElementById("searchInput");
const resultsGrid = document.getElementById("resultsGrid");
const matchCount = document.getElementById("matchCount");
const filterTabs = document.getElementById("filterTabs");

function render() {
  const query = searchInput.value.toLowerCase().trim();
  const filtered = articles.filter(a => {
    const matchCat = (currentCat === "all") || a.category.toLowerCase().includes(currentCat.toLowerCase());
    if (!matchCat) return false;
    if (!query) return true;
    return a.title.toLowerCase().includes(query) || a.snippet.toLowerCase().includes(query);
  });

  matchCount.textContent = `Найдено документов: ${filtered.length} из ${articles.length}`;
  resultsGrid.innerHTML = filtered.slice(0, 150).map(a => `
    <div class="card">
      <div>
        <div class="card-header">
          <div class="card-category">${a.category}</div>
          <span class="badge">${a.lang}</span>
        </div>
        <div class="card-title">${a.title}</div>
        <div class="card-snippet">${a.snippet}</div>
      </div>
      <a class="card-link" href="${a.url}" target="_blank">Открыть документ &rarr;</a>
    </div>
  `).join("");
}

searchInput.addEventListener("input", render);

filterTabs.addEventListener("click", e => {
  if (e.target.classList.contains("tab-btn")) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentCat = e.target.dataset.cat;
    render();
  }
});

render();
</script>
