cloned to quickly create a duplicate or perform a copy-paste action. In the simulated environment, do one of the following: To clone one object, click the object you want to clone. To clone two or mo"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Copying and pasting a selection", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Copying and pasting a selection Copying and Pasting a Selection Selected objects can be added to the clipboard, and then pasted as new content. In most cases, content pasted from the clipboard is always added at an offset from the original content. In the scene, select the objects you want to add to"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Deleting a selection", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Deleting a selection Deleting a Selection Certain types of objects and data can be permanently removed from a scene. In the scene, select the objects you want to delete. Do one of the following: Press DELETE. On the Ribbon , in the Clipboard group, click Delete ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Docking a panel", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Docking a panel Docking a Panel You can dock a panel in an area indicated by the docking manager. This can be done for any panel that is pinned to or floating freely of the main window. That is, panels unpinned or hidden must first be shown and then pinned before they can be docked elsewhere in the "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Editing panels by context", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Editing panels by context Editing Panels by Context The Enable Independence option allows you to edit a panel without affecting its state in other contexts. For example, you could resize the Properties panel and dock it to a different location in the main window when configuring a layout. Those chan"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Grouping panels", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Grouping panels Grouping Panels Panels can be grouped with one another if they are docked in the same area. Point to the title bar or tab header of the panel you want to group. Drag the panel to the same area of another panel that is indicated by the docking manager."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Hiding panels", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Hiding panels Hiding Panels A docked panel has a pushpin that allows you to hide the panel if the focus is elsewhere in the workspace. This allows you to free up screen space in the main window. View a panel. On the title bar of the panel, do one of the following: To not hide a panel, click the push"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Restoring windows", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Restoring windows Restoring Windows The Restore Windows command allows you to reset the layout of panels in the main window. By default, the Enable Global Restore option is active, thereby a restore will affect the layout of panels in all contexts. Otherwise, a restore will affect the layout of pane"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Viewing panels", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Viewing panels Viewing Panels A panel can be viewed depending on its group assignment, visibility and the overall context of a scene. For example, some panels appear automatically based on the active tab in the Ribbon or a selected item/command in the workspace. Point to a panel. Do one of the follo"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Adding commands to the QAT", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Adding commands to the QAT Adding Commands to the QAT You can add commands on the Ribbon to the QAT. On the Ribbon , find the command or group you want to add to the QAT. Right-click the command or group, and then click Add to Quick Access Toolbar ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Customizing the QAT", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Customizing the QAT Customizing the QAT You can control the availability of standard commands on the QAT and its location in the workspace. At the top left of the main window, click the Customize Quick Access Toolbar arrow. Do one or all of the following: To make a command available, point to a comm"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Removing commands from the QAT", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Removing commands from the QAT Removing Commands from the QAT You can remove commands from the QAT that you have added from the Ribbon. On the QAT , point to the command or group you want to remove. If a command belongs to a group on the QAT, you would need to remove the entire group. Right-click th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Help Tab", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Help Tab Help Tab The Help tab displays commands for accessing product documentation, online support and social media. Help and Reference Name Description Help Opens the R-Pro 2.1 Help file. Python API Opens the Python API reference guide. .NET API Opens the .NET API reference guide. Python 2.7 Open"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Simulation Controls", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Simulation Controls Simulation Controls The Simulation controls at the top of the 3D world allow you to start, stop, reset, record and customize a simulation. &#160;1. Settings &#160;2. Reset &#160;3. Play/Pause &#160;4. Clock &#160;5. Speed &#160;6. Decrease Speed &#160;7. Speed Slider &#160;8. Inc"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Cell Graph", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Cell Graph Cell Graph The Cell Graph panel provides an outline of the current layout in 3D world and options for selecting and editing listed items. 1. Show/Hide Invisible Components in 3D World 2. Search for Components 3. Type of Component 4. Selected Components 5. Component Name 6. Lock Editing fo"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Collision Detectors", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Collision Detectors Collision Detectors Create a new collision detector. Selection vs World collision detector. This compares the selected geometry against the geometries in the 3D world. Added collision detectors. These detectors check collisions between A and B geometries. Detector on/off button. "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Component Graph", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Component Graph Component Graph The Component Graph panel provides an outline of a selected component in the 3D world, including component nodes, behaviors, properties and features. &#160;1. Search Box for Component Node Tree &#160;2. Expand Options for Component Node Tree &#160;3. Root Node of Sele"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "eCatalog", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "eCatalog eCatalog The eCatalog panel allows you manage connected sources of files and load those files in the 3D world. &nbsp;1. System Collection for All Linked Files &nbsp;2. System Source for Public Documents &nbsp;3. System Source for My Documents &nbsp;4. System Collection for Usage History &nb"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Jog panel", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Jog panel Jog The Jog panel is used with the Jog command to allow you to manipulate, configure and teach a robot in the 3D world. &#160;1. Name of Selected Robot &#160;2. Position Values of TCP/End of Arm &#160;3. Orientation Values of TCP/End of Arm &#160;4. Configuration of Robot and Manipulator &"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Output panel", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Output panel Output The Output panel prints feedback on events, commands and other actions. Tips: The Output panel can be cleared automatically on simulation start. This option is found under File-Options-General. &#160;"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Process Editor", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Process Editor Process Editor The Process Editor panel allows you to add and edit process routines. &#160; 1. Name of Component and Process Executor Behavior 2. Name of Process Routine 3. Requirements Section 4. Process Definition Section 5. Selected Statement 6. Statement Gallery 7. Add Process Rou"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Process Flow Editor", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Process Flow Editor Process Flow Editor The Process Flow Editor panel allows you to add and edit process sequences associated to flow groups. The flow group has a transport route in between the process steps which is visualized and defined in the 3D viewport. &#160; 1. Expand/Collapse Flow Groups an"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Product Type Editor", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Product Type Editor Product Type Editor The Product Type Editor panel shows the product types and the assemblies created for the layout. The panel allows you to add and edit types and assemblies of products and arrange them to flow groups. You can also define properties for the product types and ass"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Program Editor", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Program Editor Program Editor The Program Editor panel allows you to view and edit a robot program, preview motions and program other types of components using RSL statements. &#160;1. Main Routine &#160;2. Statements Toolbar &#160;3. Conditional Statement &#160;4. Nested Statement &#160;5. Motion T"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Properties", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Properties Properties The Properties panel allows you to edit the properties of a selected object. 1. Position Values 2. Orientation Values 3. Property Tabs 4. Property 5. Property Section 6. Name of Object 7. Coordinate System 8. Lock Editing &#160; Contents&#160; Show Hide Context Coordinate Syste"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Backstage", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Backstage Backstage The Backstage view allows you to open and save files as well as edit preferences. 1. Navigation Pane 2. Sections 3. Screen 4. Confirm Options &nbsp; Contents&nbsp; Show Hide Access Context Commands Backup Access To access the Backstage view: Click the File tab. Context The contex"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Layout", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Layout Layout The Layout view allows you to build layouts in the 3D world using components. &nbsp; Contents&nbsp; Show Hide Access Panels Context Commands Access To access the Layout view: Click the Home tab. Panels The Layout view shows, by default, the following panels: eCatalog for browsing conne"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Modeling", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Modeling Modeling The Modeling view allows you to model new and existing components. &nbsp; Contents&nbsp; Show Hide Access Panels Context Commands Access To access the Modeling view: Click the Modeling tab. Panels The Modeling view shows, by default, the following panels: Component Graph for viewin"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Process", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Process Process The Process view allows you to define processes, product types and their flow. &nbsp; Contents&nbsp; Show Hide Access Panels Context Commands Access To access the Process view: Click the Process tab. Panels The Process view shows, by default, the following panels: Cell Graph for list"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Robot", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Robot Robot The Robot view allows you to teach and manipulate robots in the 3D world. &nbsp; Contents&nbsp; Show Hide Access Panels Context Commands Access To access the Robot view: Click the Program tab. Panels The Robot view shows, by default, the following panels: Program Editor for reading, writ"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "One to Many Interface", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "One to Many Interface One to Many Interface A One to Many Interface allows you to establish a connection with one or more matching interfaces. Properties Name Description Name Defines the name of the interface. IsAbstract Defines the type of connection supported by the interface. A True value suppor"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "One to One Interface", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "One to One Interface One to One Interface A One to One Interface allows you to establish a connection with another matching interface. Properties Name Description Name Defines the name of the interface. IsAbstract Defines the type of connection supported by the interface. A True value supports only "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Articulated Kinematics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Articulated Kinematics Articulated Kinematics An Articulated Kinematics behavior is a list of kinematic properties used by a Robot Controller for solving an articulated robot's motions which relate to joint length, angle, positioning, coupling, configuration and tolerance levels. Properties Name Des"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Cartesian Kinematics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Cartesian Kinematics Cartesian Kinematics A Cartesian Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for a Cartesian type robot (gantry, portal, etc.) in which the robot has three transitional joints and an articulated wrist (three rotational joints) defined "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Delta Kinematics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Delta Kinematics Delta Kinematics A Delta Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for delta type, parallel robots. Properties Name Description Name Defines the name of the kinematics. LinkLength1 Defines the length of the robot's driving arm from its s"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Parallelogram Kinematics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Parallelogram Kinematics Parallelogram Kinematics A Parallelogram Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller used for palletizing operations in which the wrist orientation is always pointing downward. Properties If you want to use Parallelogram Kinematics"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Python Kinematics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Python Kinematics Python Kinematics A Python Kinematics behavior allows you to define the forward and/or inverse kinematics of a Robot Controller for a robot using a script written in Python programming language. Properties Name Description Name Defines the name of the kinematics. Script Defines the"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Scara Kinematics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Scara Kinematics Scara Kinematics A Scara Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for a SCARA type robot in which the wrist is defined in one axis (generally the Z-axis) and has two possible configurations (Left and Right). Properties Name Description "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Scara Kinematics (old)", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Scara Kinematics (old) Scara Kinematics (old) A Scara Kinematics behavior calculates the forward and inverse kinematics of a Robot Controller for a SCARA type robot in which the wrist is defined in one axis (generally the Z-axis) and has two possible configurations (Left and Right). Note : This is d"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Capacity Controller", "u es Name Description Name Defines the name of the document link."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Jog Info", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Jog Info Jog Info A Jog Info allows you to make an object or property interactive by defining its degree of freedom. Properties Name Description Name Defines the name of the jog info. Offset Defines a pivot point (matrix) in the containing node's coordinate system. DOF Defines the degree of freedom "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Note", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Note Note A Note allows you to provide documentation (free-form text) for a component. In the 3D world, you can click the note icon of a selected component to view and edit its notes. The editor displays each note in its own tab and text area. There is a global font size option that affects the size"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Python Script", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Python Script Python Script A Python Script allows you to write a script for manipulating components, commands and the application using Python programming language (stackless, version 2.7). Properties Name Description Name Defines the name of the script. Script Allows you to view and edit the scrip"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Statistics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Statistics Statistics A Statistics behavior allows you to collect and report statistics generated by other behaviors in a component during a simulation. Properties Data collection can be cumulative or based on time, states and events. In order to report statistics a behavior needs to have a Statisti"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Transport Protocol", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Transport Protocol Transport Protocol A Transport Protocol allows you to handle transportation actions requested by resources using a Python Script. Properties Name Description Name Defines the name of the protocol. Statistics Defines a Statistics behavior that collects statistics generated by the p"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Vehicle", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Vehicle Vehicle A Vehicle allows you to define a component as a moving object that can be controlled using a Python Script. Properties Name Description Name Defines the name of the vehicle."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Physics Cable", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Physics Cable Physics Cable A Physics Cable allows you to create a pliable, physics cable that can be anchored to nodes in the 3D world and used for simulating ropes, chains, pulleys, belts, wires, and cables. The pins of a Physics Cable are listed as separate nodes in the Component Graph panel. Pro"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Physics Entity", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Physics Entity Physics Entity A Physics Entity allows you to define a node in a component as a physical body that is affected by the physics of the 3D world. Properties Name Description Name Defines the name of the entity. Physics Type Defines how the entity is affected by physics during simulation."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Physics Joint", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Physics Joint Physics Joint A Physics Joint allows you to configure a D6 joint with multiple degrees of freedom for a component in the 3D world. Properti me of the signal. AutomaticReset Defines if the signal is reset to its initial value when you reset a simulation. A True value resets the signal. A F"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Integer Signal", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Integer Signal Integer Signal An Integer Signal allows you to signal an integer value. Properties Name Description Name Defines the name of the signal. AutomaticReset Defines if the signal is reset to its initial value when you reset a simulation. A True value resets the signal. A False value does n"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Matrix Signal", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Matrix Signal Matrix Signal A Matrix Signal allows you to signal a 4x4 matrix value using real numbers. Properties Name Description Name Defines the name of the signal. AutomaticReset Defines if the signal is reset to its initial value when you reset a simulation. A True value resets the signal. A F"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Real Signal", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Real Signal Real Signal A Real Signal allows you to signal a real number value. Properties Name Description Name Defines the name of the signal. AutomaticReset Defines if the signal is reset to its initial value when you reset a simulation. A True value resets the signal. A False value does not rese"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "String Signal", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "String Signal String Signal A String Signal allows you to signal a string value. Properties Name Description Name Defines the name of the signal. AutomaticReset Defines if the signal is reset to its initial value when you reset a simulation. A True value resets the signal. A False value does not res"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Expressions", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Expressions Expressions Contents Functions Grouping Operators Operator Precedence Process Statement Expressions Type Conversion Types and Operators Unit Specification"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Functions", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Functions Functions A supported function can be used to write an expression. Contents&#160; Show Hide Trigonometric functions Power functions Hyperbolic functions Vector and matrix construction functions Miscellaneous functions Pseudo-random distribution functions Trigonometric functions Each functi"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Grouping Operators", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Grouping Operators Grouping Operators Grouping operators are useful for controlling the evaluation of an expression. Parentheses Expressions can be grouped by using parentheses () and are always evaluated first. 1 +2 * 3 = 7 whereas (1+2) * 3 = 9 Conditional operator A conditional operator ?: can be"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Operator Precedence", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Operator Precedence Operator Precedence Operators are evaluated based on their precedence to one another in an expression. Precedence Operator Usage Parsing Order 1 Post increment a++ Left to Right Post decrement a-- Member operator a.b Subscript operator a[b] Function call a(...) Parentheses (...) "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Process Statements", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Process Statements Process Statement Expressions When writing expressions for process statements, you can access properties of dynamic component objects and elements of lists. Member access You can use dot notation (.) to get the value of a Product , ProductType , Component or Group property. The sy"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Robot Statements", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Robot Statements Robot Statement Expressions The syntax for referencing Boolean Signal Map ports. # IN and OUT represents the Boolean Signal Maps referenced by the robot Executor behavior as inputs and outputs &#160; IN[&lt;port number&gt;] OUT[&lt;port number&gt;] &#160; # Also, any Boolean Signal "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Types and Operators", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Types and Operators Types and Operators A type specifies the characteristics of a value and determines the set of operations available for the value. Operations include operators, functions and methods. Types that have methods are complex and can have members. Contents&#160; Show Hide Expression typ"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Type Conversion", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Type Conversion Type Conversion Integers and floating-point numbers are automatically converted when one is given and the other is required. Floating-point values can be truncated to integers using a cast operator. When converting floating-point numbers to integers, no rounding is performed. (int)2."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Unit Specification", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Unit Specification Unit Specification Unit specification allows you to specify the unit of a given value, which may or may not be a canonical unit. Contents&nbsp; Show Hide Usage Built-in Units Usage Generally, unit specifications are used in expressions when defining a certain quantity. This allows"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Angular Clone", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Angular Clone Angular Clone An Angular Clone feature clones its child features around its Z-axis. Generally, you would use an Angular Clone with a Transform feature to define a radius and adjust the positioning of cloned objects. Properties Name Description Name Defines the name of the feature. Coun"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Block", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Block Block A Block feature is a cube/box shape. Generally, a Block is shaped and made parametric using expressions with component properties. Properties Name Description Name Defines the name of the block. Visible Turns on/off the visibility of block. Material Defines the material of the block. Len"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Boolean", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Boolean Boolean The boolean feature is used for intersect/unite/subtract geometry operations based on the 2 child features assigned to it. Each geometry set of the first child feature is traversed and applied to the boolean operation while traversing each set on the second feature. Result is stored "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Cone", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Cone Cone A Cone feature is a cone/frustum shape. Cones are flexible shapes that can be modeled to visualize spaces, viewing angles, fields and other types of objects on the fly. Properties Name Description Name Defines the name of the cone. Visible Turns on/off the visibility of cone. Material Defi"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Cylinder", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Cylinder Cylinder A Cylinder feature is a cylindrical shape. Cylinders are flexible shapes that can be molded into many different objects. Properties Name Description Name Defines the name of the cylinder. Visible Turns on/off the visibility of cylinder. Material Defines the material of the cylinder"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Extrude", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Extrude Extrude An Extrude feature extrudes the geometry of its child features. Extrusions can be used to warp and distort objects that supposed to be malleable as well extrude surfaces. Properties Name Description Name Defines the name of the feature. Material Defines the material of the extrusion."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Frame", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Frame Frame A Frame feature is a reference point in the 3D world with a defined position and orientation. Frames are often transformed and referenced by behaviors to simulate actions. Properties Name Description Name Defines the name of the frame. Visible Turns on/off the visibility of frame. UseAsG"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Geometry", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Geometry Geometry A Geometry feature is a container of geometry that is either imported or generated in the feature or collapsed from other features. Geometry features can be used to load interchangeable geometry and is the default container for imported geometry. Properties Name Description Name De"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Linear Clone", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Linear Clone Linear Clone A Linear Clone feature clones its child features along an axis. In some cases, Linear Clone operations are chained together to clone objects along two or more axes. Properties Name Description Name Defines the name of the feature. Count Defines the number of times to clone "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Mirror", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Mirror Mirror A Mirror feature mirrors and scales its child features in one to three axes. A Mirror operation can be helpful when you want to visualize geometry and keep file size low, for example when you need to use one geometry file for pillars and support columns. Properties Name Description Nam"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Plane", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Plane Plane A Plane feature is a two-dimensional flat surface. Generally, a Plane is used for visualization purposes or to aid in the selection and interactive picking of geometry in the 3D world. Properties Name Description Name Defines the name of the plane. Visible Turns on/off the visibility of "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Python Feature", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Python Feature Python Feature A Python Feature generates geometry and transforms child features using a script written in Python. Properties Name Description Name Defines the name of the feature. Script Defines the feature's Python script. When the feature is initially created, the script is initial"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Revolve", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Revolve Revolve A Revolve feature sweeps the geometry of child features along a path, thereby constructing new geometry. Generally, a Revolve operation is used to sweep geometry, which sometimes requires the use of Transform and Extrude features. Properties Name Description Name Defines the name of "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Sphere", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Sphere Sphere A Sphere feature is a spherical shape. Spheres can be molded into different shapes, for example capsules and balls, and used as indicators in the 3D world. Properties Name Description Name Defines the name of the sphere. Visible Turns on/off the visibility of sphere. Material Defines t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Switch", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Switch Switch A Switch feature selects one of its child features and disables the other child features. Switch operations are helpful if you need to switch out geometry or other operations based on component properties. Properties Name Description Name Defines the name of the switch. Choice Defines "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Text", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Text Text A Text feature is a container of text that is visualized in the 3D world. Text features are helpful at labeling processes and stages in a layout as well as the flow of components. Properties Name Description Name Defines the name of the feature. Visible Turns on/off the visibility of text."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Transform", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Transform Transform A Transform feature allows you to write expressions for transforming child features. Transform operations use a dot (.) character to separate nested expressions, and you should refer to Operator Precedence to know the parsing order for the transformation. Properties Name Descript"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Wedge Feature", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Wedge Wedge Feature A Wedge feature is a wedge-like shape. Wedges can be molded into different shapes that can be varying lengths and heights as well as mirrored along different axes. Properties Name Description Name Defines the name of the wedge. Visible Turns on/off the visibility of wedge. Materi"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Append To List", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Append To List Append To List An AppendToList statement allows you to join a variable (SourceVariable) to another variable (TargetVariable). Both Source and TargetVariables can be lists, but do not need to be. The type of the TargetVariable will be changed to a list type (if is not already). . Prope"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Assign Process Variable", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Assign Process Variable Assign Variable An AssignVariable statement allows you to set the value of a process variable. Note: Assign statement does not support Product Variables with Product Instances. However, you can still assign an empty (null) value to a product variable to reuse it, for example,"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Attach", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Attach Attach An Attach statement allows you to attach child product to a parent product. &#160; Properties Name Description Parent Parent product variable name. Child Child product variable name."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Break", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Break Break A Break statement immediately ends the execution of a While statement. &#160;"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Buffer", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Buffer Buffer A Buffer statement allows you to create a temporary storage for products in a grid pattern. Multiple products can be coming in and leaving the buffer in parallel. Transport of products is handled similarly to the Transport statements. The statement continues execution until the break c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Change Type", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Change Type Change Type A ChangeType statement allows you to change a product instance to be of another product type both logically and visually. Currently, ChangeType does not support Assemblies. &#160; &#160; Properties Name Description ProductVariableName Variable where to get the product instanc"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "CheckAssembly", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "CheckAssembly CheckAssembly Checks if current state of an Assembly Instance matches a given Assembly Order and saves the result into a Process variable. The result variable is set to True when all Pattern Slots selected in the Assembly Order are filled with products, and False otherwise. Figure 1. E"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Comment", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Comment Comment A Comment statement is a non-executable statement that is used to leave comments about the program. Properties Name Description Comment Defines the text of the comment."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Construct", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Construct Construct Creates an empty Assembly Instance and then fills it with the given products. The given Assembly Order defines both the Assembly Product Type to create, and to which Pattern Slots the Product Instances are placed into. The products are placed into Pattern Slots in the correct ass"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Continue", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Continue Continue A Continue statement is used to loop back the execution of a While statement to its beginning. This, of course, would skip over all other remaining statements in the scope and re-evaluate the condition of the loop. &#160;"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Create", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Create Create The Create statement is used to create a new Product Instance of the selected Product Type. Also, see the ProductCreator behavior and TransportIn statement, which are alternate ways of creating or transporting products into the process. RetainOffsetFromAssembly is used to control the p"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Delay", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Delay Delay A Delay statement allows you to delay the process execution by a given amount of time. &#160; Properties Name Description TimeSource You can either use Distribution property or Expression property as a time source. Distribution Pseudo-random real number generated by an expression that de"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Detach", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Detach Detach A Detach statement allows you to detach one or more product instances from a common parent product instance. Properties Name Description ProductVariableName Input variable from which to get the parent product instance. DetachedVariableName Output variable where to store references to t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Find Flow Step", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Find Flow Step FindFlowStep Finds next or previous process flow steps relative to an existing flow step. Reads in a ProcessFlowInfo object from a process variable and creates a new ProcessFlowInfo into another process variable. The created ProcessFlowInfo points to same process sequence as the input"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Flow", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Flow Flow A Flow statement allows you to update statistics behavior and record given product(s) transferring in or out of the component container. If ProductVariableName is a list, all products in the list are recorded at once. &#160; Properties Name Description ProductVariableName The name of the p"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Get Flow Step", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Get Flow Step Get Flow Step A GetFlowStatement gets information about a step in a process sequence to a ProcessFlowInfo process variable. This ProcessFlowInfo can be then further used in other statements. If FlowStepSource is set as &quot;flow sequence step&quot; or &quot;flow sequence process group"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Get Assembly", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Get Assembly Get Assembly Creates an Assembly Order object that defines a subset of an assembly, which can be passed to other statements to perform statement-specific actions to the selected Assembly Steps. All Assembly Steps are owned by an Assembly Product Type, so an Assembly Order always specifi"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Get Assembly Step Property", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Get Assembly Step Property Get Assembly Step Property Finds a property from selected Assembly Steps of an Assembly Type and copies its value to a Process variable. An Assembly Order is used to define one or more Assembly Steps from an Assembly Product Type that should contain a user-defined property"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Get Products", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Get Products Get Products Gets references to Product Instances from a component container and stores them to a Process Variable. Only Product Instances that match the Product Type filter are returned, and the maximum number matching of Product Instances to return can be limited using the MaxCount pr"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Get Property", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Get Property Get Property A GetProperty statement is used to access any static component’s property or its behavior property in a layout (including self/owner component). Note: Only Int, Real, Vector, Matrix and String type properties are supported. Properties Name Description SelectedComponent Sour"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Halt", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Halt Halt A Halt statement allows you to stop or reset process execution or a simulation. Properties Name Description HaltSimulation Turns on/off the halting of a simulation. ResetSimulation Turns on/off the resetting of a simulation."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "If", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "If If An If statement allows you to execute Then or Else scope of statements based on a condition. If the condition is true, the process executes the statements in the Then-scope. If the condition is false, the process executes the statements in the Else-scope. Properties Name Description Condition "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Move Joint", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Move Joint Move Joint A MoveJoint statement allows you to move a joint to specified target value over time. You can move only one joint at a time. The joint must be linked to a controller and it must be in the same component where the process executor is. The statement line execution will end when t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Print", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Print Print A Print statement allows you to print user messages to the Output panel. Properties Name Description Message The message to be printed in the Output panel PrependHeader When selected, the message is printed along with a prefix indicating its owner. ComponentName::ProcessExecutorName::Pro"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Property Condition", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Property Condition Property Condition A PropertyCondition is a requirement statement and that allows you to create a requirement based on a property value. Select first a component and then select either its property by leaving Selected behavior Null, or alternatively, select component's behavior to"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Release Product Reservation", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Release Product Reservation Release Product Reservation A ReleaseReservedProduct statement allows you to release product instances which are reserved by ReserveProduct statement. The releasing of a product must be done prior its transport has started. Properties Name Description ProductVariableName "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Remove", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Remove Remove A Remove statement allows you to remove the product instance from simulation and reset the value of the variable. Properties Name Description ProductVariableName Name of input variable that is to be removed from simulation. AssemblyOrderVariableName Name of the Process variable where t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Reserve Product", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Reserve Product Reserve Product A Reserve Product statement is a requirement statement that allows you to create a requirement for a matching product to be available. Multiple of these reservations can be used in same process. Reserved product can be any or filtered by product types or flow groups. "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Run Robot Routine", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Run Robot Routine Run Robot Routine A Run Robot Routine statement allows you to run a pre-programmed routine on a robot. Multiple process executors can share a robot by using this statement type. It is also possible to use that same robot from python, as long as that python code follows the instruct"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Select Products", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Select Products Select Products A SelectProducts statement allows you to split filtered product types from variable to a new variable. Properties Name Description ProductVariableName Name of the input list variable to split from. SplitVariableName The name of the output list variable name to split t"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Send Signal", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Send Signal Send Signal A Send Signal statement allows you to trigger a signal behavior with a given value. You can select a Boolean, Integer, Real, String or Component signal from any static component in the simulation layout. Properties Name Description Component Component that owns the signal. Nu"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Set Next Flow Step", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "SetNextFlowStep Set Next Flow Step Overwrites the next process information in product instances, enabling jumps and loops. If the process variable identified by FlowStepVariableName is a list of ProcessFlowInfo then the process variable identified by ProductVariableName should be a list of Products "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Set Node Material", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Set Node Material Set Node Material A SetNodeMaterial statement allows you to change the material of the defined node (link) of the component of a product instance. Properties Name Description Material Select the material. Force &#160; If Selected, Inherit node's material to all geometries in the no"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Set Node Visibility", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Set Node Visibility Set Node Visibility A SetNodeVisibility statement allows you to show or hide a node of a component of the Product instance. The node is indentified by its name defined by the NodeName variable. If no NodeName is given, the root node of the component is shown or hidden. Properties"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Set State", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Set State Set State A SetState statement allows you to set the statistical state of a machine. It allows you to access and change standard Statistics behavior’s state of a machine. &#160; Properties Name Description Statistics Statistics behavior of the component State Component state defined in the"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Start Transport In", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Start Transport In Start Transport In A StartTransportIn statement allows you to start transporting one or more products instances into the process and to execute other statements while that is being done. This statement is typically used before a WaitTransport statement, with any number of other st"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Start Transport Out", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Start Transport Out Start Transport Out A StartTransportOut statement allows you to start transporting one or more products instances out of the process and to execute other statements while that is being done. This statement is typically used before a WaitTransport statement, with any number of oth"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Switch Case", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Switch Case Switch Case A SwitchCase statement allows you to execute one of the predefined case scopes, based on evaluated value of the Condition expression. Each case scope defines a test for the condition value, and the first case where the test is passed, i.e. evaluates to True, gets executed. Th"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Transport In", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Transport In Transport In Description A TransportIn statement allows you to transport one or more product instances into the process. The statement can operate in one of two modes: in Transport Products mode the transported product(s) will be saved into the output variable directly, while in Process"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Transport Out", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Transport Out Transport Out Description A TransportOut statement allows you to transport one or more product instance(s) out of the process. The statement can operate in one of two modes: in Transport Products mode the input variable is expected to contain one or more product instances that will be "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Transport Pattern In", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Transport Pattern In Transport Pattern In A TransportsPatternIn allows you to transport available product instances sequentially in a pattern. Reserved Products TransportsPatternIn supports using products reserved by ReserveProduct statement. Define which reserved product are used by ReservedProduct"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Wait Property Condition", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Wait Property Condition Wait Property Condition WaitPropertyCondition statement allows you to wait for a variable to have specified value. VariableName and Condition property values form a single expression that is evaluated every time the value of the variable defined by VariableName changes. Varia"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Wait Signal", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Wait Signal Wait Signal A Wait Signal statement allows you to pause process execution until a signal is received. You can use it also to assign a signal value to a Process variable for later use of other statements. You can select a Boolean, Integer, Real or String signal of any static component in "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Wait Transport", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Wait Transport Wait Transport A WaitTransport statement allows you to wait for one or more transport operations started with StartTransportIn or StarTransportOut statements to complete. The transport operations are identified by the ProductVariableName. Note: The variable is in undefined state betwe"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "While", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "While While A While statement allows you to execute a scope of statements in a loop as long as the condition is true. Properties Name Description Condition Defines an expression that when evaluated must return a True or False value. &#160; True value executes a scope of statements, and then the prog"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Work", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Work Work A Work statement reserves one resource from transport controller to work in the process. Properties Name Description Controller Defines the transport controller delegating the work to a resource. ProcessTime Defines the duration of the work. ResourcePositionFrame Frame location where a res"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Assign Robot Variable", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Assign Robot Variable Assign Variable An Assign Variable statement sets the value of a robot variable. Contents&#160; Show Hide Robot Variables Properties Robot Variables Routine Variables A robot routine variable is a local variable in a robot program specific to a routine. For example, a variable "}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Call Sequence", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Call Sequence Call Sequence A Call Sequence statement allows a routine to branch out and execute another subroutine in a robot program. Properties Name Description Routine Defines a subroutine in robot program called by the statement. Note: You cannot call the Main routine of a robot program as a su"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Define Base", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Define Base Define Base A Define Base statement changes the properties of a base frame in robot during a simulation. When you reset a simulation, the base frame returns to its initial position. Note: A base frame can be used as a base coordinate system for motion statements. Moving a base frame woul"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Define Tool", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Define Tool Define Tool A Define Tool statement changes the properties of a tool frame in robot during a simulation. When you reset a simulation, the tool frame returns to its initial position. Note: A tool frame can be used as a tool center point (tcp) for motion statements. Moving a tool frame wou"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Linear Motion", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Linear Motion Linear Motion A Linear Motion statement is a motion in which a robot uses its current configuration to reach a position in the shortest distance possible. Example. Linear motion of robot from P1 to P2 Properties Position Name Description Position Defines the position matrix using XYZ c"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Path", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Path Path A Path statement allows you to add and edit robot positions along the curves and bisectors of geometry. For more information, see Teaching a path of positions ."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Point-to-Point Motion", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Point-to-Point Motion Point-to-Point Motion A Point-to-Point Motion statement is a motion in which a robot interpolates its joint values to reach a position. Example. Point-to-point motion of robot from P1 to P2 Properties Position Name Description Position Defines the position matrix using XYZ coor"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Program Synchronize", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Program Synchronize Program Synchronize A Program Synchronize statement allows the execution of a robot program to be synced with programs in other robots. Properties Name Description SyncMessage Defines the message to trigger synchronization. All components in SyncComponents must use the same messa"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Return", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Return Return A Return statement ends the execution of a routine. In most cases, you would use a Return statement to end the execution of a called subroutine in a robot program."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Set Binary Output", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Set Binary Output Set Binary Output A Set Binary Output statement sets the value of a signal mapped to an output port in robot. Properties Name Description OutputPort Defines the output port of robot set by the statement. OutputValue Defines the value of OutputPort."}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Set Statistics", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Set Statistics Set Statistics A Set Statistics statement allows you to set statistics states for a robot. Properties Name Description Statistics Select the Statistics behavior to be used from the component. State Select the current state for the robot. New states can be added from accessing the Stat"}, {"category": "R-PRO / VC CAD CORE MANUAL", "tab": "CAD EN", "title": "Wait for Binary Input", "url": "", "badge": "EN", "badge_type": "en", "doc_type": "html", "snippet": "Wait for Binary Input Wait for Binary Input A Wait for Binary Input statement delays the execution of a robot program until the value of a signal mapped to an input port in robot has a specific value. The evaluation of an input port can be cyclic or triggered by a signal event. Properties Name Descr"}, {"category": "ERGONOMICS MODULE (RULA/REBA/ISO)", "tab": "Эргономика Р-Про", "title": "ИСО 11226", "url": "", "badge": "ERGO", "badge_type": "api", "doc_type": "html", "snippet": "ИСО 11226 Navigation: &nbsp; Содержание &nbsp;&gt; ИСО 11226 Как выставляется оценка ИСО 11226? Оценка соответствует ГОСТ ИСО 11226 пункт 3.4. URL: https://meganorm.ru/Data/481/48167.pdf ."}, {"category": "ERGONOMICS MODULE (RULA/REBA/ISO)", "tab": "Эргономика Р-Про", "title": "Содержание", "url": "", "badge": "ERGO", "badge_type": "api", "doc_type": "html", "snippet": "Содержание Navigation: &nbsp; &raquo;No topics above this level&laquo; Содержание Описание Установка Использование RULA REBA ИСО 11226"}, {"category": "ERGONOMICS MODULE (RULA/REBA/ISO)", "tab": "Эргономика Р-Про", "title": "Использование", "url": "", "badge": "ERGO", "badge_type": "api", "doc_type": "html", "snippet": "Использование Navigation: &nbsp; Содержание &nbsp;&gt; Использование Описание инструмента Запустите ПО Рациональное производство. - Для начала работы загрузите необходимую планировку. - На планировке должен присутствовать компонент «Оператор MoCap (Имя)», который можно найти в электронном каталоге «"}, {"category": "ERGONOMICS MODULE (RULA/REBA/ISO)", "tab": "Эргономика Р-Про", "title": "RULA", const searchInput = document.getElementById('searchInput');
const resultsGrid = document.getElementById('resultsGrid');
const matchCount = document.getElementById('matchCount');
const tabs = document.querySelectorAll('.tab-btn');
const docModal = document.getElementById('docModal');
const modalIframe = document.getElementById('modalIframe');
const modalViewerText = document.getElementById('modalViewerText');
const modalDocTitle = document.getElementById('modalDocTitle');
const modalExternalLink = document.getElementById('modalExternalLink');

let currentTab = 'all';

function render(items) {
  resultsGrid.innerHTML = '';
  matchCount.textContent = 'Найдено документов: ' + items.length + ' из ' + articles.length;
  
  const fragment = document.createDocumentFragment();
  const limit = Math.min(items.length, 120); // Render top 120 matches smoothly
  
  for (let i = 0; i < limit; i++) {
    const a = items[i];
    const card = document.createElement('div');
    card.className = 'card';
    
    let badgeClass = 'badge-' + (a.badge_type || 'ru');
    
    card.innerHTML = `
      <div>
        <div class="card-header">
          <span class="card-category">${a.category}</span>
          <span class="badge ${badgeClass}">${a.badge}</span>
        </div>
        <div class="card-title">${a.title}</div>
        <div class="card-snippet">${a.snippet}</div>
      </div>
      <button class="card-link" onclick="openDoc(${articles.indexOf(a)})">Открыть документ →</button>
    `;
    fragment.appendChild(card);
  }
  
  resultsGrid.appendChild(fragment);
  if (items.length > limit) {
    const moreNotice = document.createElement('div');
    moreNotice.style.gridColumn = '1 / -1';
    moreNotice.style.textAlign = 'center';
    moreNotice.style.padding = '20px';
    moreNotice.style.color = '#94a3b8';
    moreNotice.textContent = 'Показаны первые ' + limit + ' результатов. Уточните поисковый запрос для более точной фильтрации.';
    resultsGrid.appendChild(moreNotice);
  }
}

function filterDocs() {
  const q = searchInput.value.toLowerCase().trim();
  const filtered = articles.filter(a => {
    const matchCat = (currentTab === 'all') || (a.tab === currentTab);
    if (!matchCat) return false;
    if (!q) return true;
    return a.title.toLowerCase().includes(q) ||
           a.snippet.toLowerCase().includes(q) ||
           a.category.toLowerCase().includes(q) ||
           (a.url && a.url.toLowerCase().includes(q));
  });
  render(filtered);
}

function openDoc(idx) {
  const doc = articles[idx];
  if (!doc) return;
  
  modalDocTitle.textContent = doc.title;
  modalExternalLink.href = doc.url;
  
  if (doc.doc_type === 'video' && doc.ytid) {
    modalViewerText.style.display = 'none';
    modalIframe.style.display = 'block';
    modalIframe.src = 'https://www.youtube.com/embed/' + doc.ytid + '?autoplay=1';
    docModal.style.display = 'flex';
  } else if (doc.url.endsWith('.html') || doc.url.endsWith('.htm')) {
    modalViewerText.style.display = 'none';
    modalIframe.style.display = 'block';
    modalIframe.src = doc.url;
    docModal.style.display = 'flex';
  } else if (doc.url.endsWith('.pdf')) {
    modalViewerText.style.display = 'none';
    modalIframe.style.display = 'block';
    modalIframe.src = doc.url;
    docModal.style.display = 'flex';
  } else if (doc.url.endsWith('.md') || doc.url.endsWith('.csv') || doc.url.endsWith('.osim') || doc.doc_type === 'api') {
    modalIframe.style.display = 'none';
    modalViewerText.style.display = 'block';
    modalViewerText.textContent = 'Загрузка: ' + doc.url + '...\n\n' + doc.snippet;
    
    // Fetch and display content
    fetch(doc.url)
      .then(r => r.text())
      .then(t => {
        modalViewerText.textContent = t.slice(0, 100000); // Display up to 100KB
      })
      .catch(e => {
        modalViewerText.textContent = doc.title + '\n\n' + doc.snippet + '\n\nЛокальный путь к файлу: ' + doc.url;
      });
    docModal.style.display = 'flex';
  } else {
    // External link or general
    window.open(doc.url, '_blank');
  }
}

function closeDoc() {
  docModal.style.display = 'none';
  modalIframe.src = 'about:blank';
}

// Close on ESC
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDoc();
});

// Close when clicking modal backdrop
docModal.addEventListener('click', (e) => {
  if (e.target === docModal) closeDoc();
});

tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.getAttribute('data-cat');
    filterDocs();
  });
});

searchInput.addEventListener('input', filterDocs);

// Initial render
filterDocs();
</script>
