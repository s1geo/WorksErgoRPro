<H1>Opening a New Layout</H1>
<P>When you start R-Pro 2.1 a new empty layout is opened automatically in the 3D 
world. If you want to clear and remove everything in the 3D world layout:</P>
<UL style="LIST-STYLE-TYPE: disc">
  <LI class=Unordered>Click the <SPAN class=Strong>File</SPAN> tab, and then on 
  the <SPAN class=Strong>Navigation</SPAN> pane, click <SPAN class=Strong>Clear 
  All</SPAN>. </LI></UL>
<P><SPAN class=Strong>Tip:</SPAN> You can press CTRL+N to clear the 3D 
world.</P></BODY></HTML>
