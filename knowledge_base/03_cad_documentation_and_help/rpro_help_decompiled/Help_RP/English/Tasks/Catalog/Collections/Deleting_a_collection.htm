<h1>Deleting a Collection</h1>
<p>You may delete a collection from the eCatalog panel.</p>
<ol style="list-style: decimal;">
<li class="Ordered">In the <span class="Strong">eCatalog</span> panel<span>,</span> access the <span class="Strong">Collections</span> view.</li>
<li class="Ordered">Right-click the collection you want to delete, and then click <span class="Strong">Delete</span>.</li>
</ol>
