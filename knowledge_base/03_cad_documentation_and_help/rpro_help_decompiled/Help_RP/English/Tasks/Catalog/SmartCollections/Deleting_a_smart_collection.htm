<h1>Deleting a Smart Collection</h1>
<p>You may delete a smart collection from the eCatalog panel.</p>
<ol>
<li class="Ordered">In the <span class="Strong">eCatalog</span> panel, access the <span class="Strong">Collections</span> view.</li>
<li class="Ordered">Right-click the smart collection you want to delete, and then click <span class="Strong">Delete</span>.</li>
</ol>
