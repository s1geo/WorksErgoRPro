<h1>Adding Collections and Sources to Groups</h1>
<p>Collections and sources can be grouped with one another in a collection group.</p>
<ol>
<li class="Ordered">In the <span class="Strong">eCatalog</span> panel<span>,</span> access the <span class="Strong">Collections</span> view.</li>
<li class="Ordered">Find the collections and/or sources you want to group, and then drag them into a collection group.</li>
</ol>
