<h1>Adding a Collection Group</h1>
<p>You can add a collection group in the eCatalog panel.</p>
<ol>
<li class="Ordered">In the <span class="Strong">eCatalog</span> panel<span>,</span> access the <span class="Strong">Collections</span> view.</li>
<li class="Ordered">Click the <span class="Strong">PLUS SIGN</span><span>,</span> and then click <span class="Strong">Add Collection Group</span>.</li>
</ol>
