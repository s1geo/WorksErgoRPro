<h1>Searching for Items</h1>
<p>You can search for items using keywords that are closely associated with an item's metadata, for example tags.</p>
<ol>
<li class="Ordered">In the <span class="Strong">eCatalog</span> panel<span>,</span> click a collection or source.</li>
<li class="Ordered">In the <span class="Strong">Display</span> area<span>,</span> <span class="Strong">Search</span> box<span>,</span> type one or more keywords to find items.</li>
</ol>
