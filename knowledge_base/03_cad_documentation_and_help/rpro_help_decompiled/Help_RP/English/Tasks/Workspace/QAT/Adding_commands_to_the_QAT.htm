<h1>Adding Commands to the QAT</h1>
<p>You can add commands on the Ribbon to the QAT.</p>
<ol>
<li class="Ordered">On the <span class="Strong">Ribbon</span>, find the command or group you want to add to the QAT.</li>
<li class="Ordered">Right-click the command or group, and then click <span class="Strong">Add to Quick Access Toolbar</span>.</li>
</ol>
