<h1>Deleting a Selection</h1>
<p>Certain types of objects and data can be permanently removed from a scene.</p>
<ol>
<li class="Ordered">In the scene, select the objects you want to delete.</li>
<li class="Ordered">Do one of the following:
<ul style="list-style: disc;">
<li class="Unordered">Press DELETE.</li>
<li class="Unordered">On the <span class="Strong">Ribbon</span>, in the <span class="Strong">Clipboard</span> group, click <span class="Strong">Delete</span>.</li>
</ul>
</li>
</ol>
