<h1>Grouping Panels</h1>
<p>Panels can be grouped with one another if they are docked in the same area.</p>
<ol>
<li class="Ordered">Point to the title bar or tab header of the panel you want to group.</li>
<li class="Ordered">Drag the panel to the same area of another panel that is indicated by the docking manager.</li>
</ol>
