<h1>Repeating a Simulation</h1>
<p>A simulation can be repeated to loop back and repeat simulated processes.</p>
<ol>
<li class="Ordered">In the 3D world, on the <span class="Strong">Simulation</span> controls, click <span class="Strong">Settings</span>.</li>
<li class="Ordered">Select the <span class="Strong">Repeat</span> check box.</li>
</ol>
